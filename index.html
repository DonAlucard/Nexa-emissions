<style>
  :root {
    --bg-0: #050b1a;
    --bg-1: #0a1428;
    --bg-2: #0f1c36;
    --bg-card: #0c1830;
    --bg-card-hi: #142345;
    /* Hairlines — quiet by default, scaled for dark theme */
    --hairline:   rgba(255, 255, 255, 0.06);
    --hairline-2: rgba(255, 255, 255, 0.10);
    --hairline-3: rgba(255, 255, 255, 0.14);
    /* Legacy aliases (kept for compatibility within file) */
    --line:   rgba(255, 255, 255, 0.06);
    --line-2: rgba(255, 255, 255, 0.10);
    --line-3: rgba(255, 255, 255, 0.14);
    --gold:    #f5c518;
    --gold-2:  #ffd455;
    --gold-3:  #b88c08;
    --gold-glow: rgba(245, 197, 24, 0.35);
    --text:   #e8edf5;
    --text-2: #9aa7bd;
    --text-3: #5d6b85;
    /* Motion — Apple-style smoothing */
    --ease: cubic-bezier(0.32, 0.72, 0, 1);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg-0);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, "Helvetica Neue", sans-serif;
    font-weight: 400;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    scroll-behavior: smooth;
    /* Tabular figures site-wide so numbers always align column-by-column */
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum' 1, 'ss01' 1, 'cv11' 1;
  }
  h1, h2, h3, h4, h5 { font-feature-settings: 'tnum' 1, 'ss01' 1, 'cv11' 1, 'salt' 1; }
  body {
    background:
      radial-gradient(ellipse 90% 50% at 50% 0%, rgba(245, 197, 24, 0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 100% 25%, rgba(56, 124, 240, 0.09), transparent 70%),
      radial-gradient(ellipse 60% 40% at 0% 60%, rgba(245, 197, 24, 0.06), transparent 70%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(40, 90, 200, 0.07), transparent 70%),
      linear-gradient(180deg, #050b1a 0%, #08122a 50%, #060e22 100%);
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.008) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.008) 1px, transparent 1px);
    background-size: 64px 64px;
    pointer-events: none;
    z-index: 0;
    mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, #000 20%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse 60% 50% at 50% 40%, #000 20%, transparent 90%);
  }
  #root { position: relative; z-index: 1; }
  ::selection { background: var(--gold); color: #050b1a; }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .mono, .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-feature-settings: 'tnum' on; letter-spacing: -0.01em; }
  .container { max-width: 1180px; margin: 0 auto; padding: 0 32px; }
  .container-wide { max-width: 1280px; margin: 0 auto; padding: 0 32px; }

  /* SCROLL REVEAL — CSS-only, runs once on mount, no observer */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .reveal { animation: fadeUp .7s cubic-bezier(.2,.7,.2,1) both; }
  .reveal.in { } /* legacy, no-op */
  .reveal-d1 { animation-delay: .06s; }
  .reveal-d2 { animation-delay: .12s; }
  .reveal-d3 { animation-delay: .18s; }
  .reveal-d4 { animation-delay: .24s; }

  /* NAV — fixed glass strip (sticky breaks under overflow-x: hidden, so use fixed) */
  body { padding-top: 64px; }
  html { scroll-padding-top: 80px; }
  body.celebrating { padding-top: 132px; }
  body.celebrating .nav { top: 68px; }
  body.celebrating { scroll-padding-top: 148px; }

  /* HALVING CELEBRATION */
  .halving-banner {
    position: fixed; top: 0; left: 0; right: 0;
    height: 68px;
    background: linear-gradient(135deg, #B58F39 0%, #FFD700 35%, #FFE89A 70%, #FFD700 100%);
    z-index: 200;
    display: flex; align-items: center;
    box-shadow: 0 6px 28px rgba(245, 197, 24, 0.45), 0 0 0 1px rgba(255,255,255,0.18) inset;
    overflow: hidden;
    animation: bannerSlideIn .55s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes bannerSlideIn {
    from { transform: translateY(-100%); }
    to   { transform: translateY(0); }
  }
  .halving-banner::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 80% at 50% 0%, rgba(255,255,255,0.45), transparent 70%);
    pointer-events: none;
  }
  .halving-banner-inner {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    width: 100%; position: relative; z-index: 1;
  }
  .halving-emoji {
    font-size: 30px;
    flex: 0 0 auto;
    animation: emojiBounce 1.2s ease-in-out infinite;
  }
  @keyframes emojiBounce {
    0%, 100% { transform: translateY(0) rotate(-8deg); }
    50%      { transform: translateY(-4px) rotate(8deg); }
  }
  .halving-text {
    flex: 1; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    color: #1a1a2e;
  }
  .halving-text strong {
    font-family: 'Inter', sans-serif;
    font-size: 18px; font-weight: 700; letter-spacing: -0.018em;
  }
  .halving-text span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; opacity: 0.78;
  }
  .halving-dismiss {
    width: 36px; height: 36px; border-radius: 50%;
    background: rgba(5, 11, 26, 0.18);
    border: 1px solid rgba(5, 11, 26, 0.25);
    color: #050b1a;
    font-size: 22px; line-height: 1; cursor: pointer;
    transition: background .25s var(--ease), transform .15s var(--ease);
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    font-family: inherit;
  }
  .halving-dismiss:hover { background: rgba(5, 11, 26, 0.32); transform: rotate(90deg); }

  .halving-confetti {
    position: fixed; top: 68px; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 199;
    overflow: hidden;
  }
  .confetti-piece {
    position: absolute; top: -24px;
    width: 10px; height: 14px;
    border-radius: 2px;
    animation: confettiFall linear infinite;
    transform-origin: center;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(-30px) rotate(0deg); opacity: 1; }
    85%  { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  @media (max-width: 720px) {
    body.celebrating { padding-top: 168px; }
    body.celebrating .nav { top: 104px; }
    .halving-banner { height: 104px; padding: 0 16px; }
    .halving-banner-inner { flex-direction: column; align-items: flex-start; gap: 6px; padding: 12px 0; }
    .halving-confetti { top: 104px; }
    .halving-text { gap: 8px; }
    .halving-text strong { font-size: 16px; }
    .halving-dismiss { position: absolute; top: 12px; right: 16px; }
  }

  /* MARKET (live price tiles) */
  .market-tile.positive .net-tile-val { color: #5fcfb8; text-shadow: 0 0 22px rgba(95,207,184,0.32); }
  .market-tile.negative .net-tile-val { color: #FF6B9D; text-shadow: 0 0 22px rgba(255,107,157,0.32); }
  .market-source {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em;
    margin-top: 8px;
  }
  .market-source a { color: var(--text-2); text-decoration: none; transition: color .25s; }
  .market-source a:hover { color: var(--gold); }
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    background: linear-gradient(180deg, rgba(5, 11, 26, 0.62), rgba(5, 11, 26, 0.46));
    border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 24px rgba(0, 0, 0, 0.28);
  }
  .nav-inner { display: flex; align-items: center; justify-content: space-between; height: 64px; }
  .logo {
    display: inline-flex; align-items: center; gap: 12px;
    font-weight: 500; font-size: 14px; letter-spacing: -0.005em;
    cursor: pointer;
    color: inherit; text-decoration: none;
    transition: opacity .25s var(--ease);
  }
  .logo:hover { opacity: 0.9; }
  .logo-mark {
    width: 30px; height: 30px;
    display: inline-flex; align-items: center; justify-content: center;
    flex: 0 0 auto;
    filter: drop-shadow(0 0 8px rgba(245, 197, 24, 0.25));
    transition: filter .3s var(--ease), transform .35s var(--ease);
  }
  .logo:hover .logo-mark {
    filter: drop-shadow(0 0 14px rgba(245, 197, 24, 0.55));
    transform: rotate(10deg) scale(1.06);
  }
  .logo-mark svg { width: 100%; height: 100%; display: block; }
  .logo-sep { color: var(--text-3); margin: 0 8px; font-weight: 300; }
  .logo-sub { color: var(--text-2); font-weight: 400; }
  .nav-links { display: flex; gap: 22px; font-size: 13px; color: var(--text-2); flex-wrap: nowrap; min-width: 0; flex-shrink: 1; }
  .nav-links a { color: inherit; text-decoration: none; transition: color .15s; cursor: pointer; white-space: nowrap; }
  .nav-links a:hover { color: var(--text); }
  .nav-status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); white-space: nowrap; flex-shrink: 0; }
  .nav-status .num { white-space: nowrap; }
  .nav-status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 10px var(--gold); animation: pulse 2.4s ease-in-out infinite; flex-shrink: 0; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  /* Curated 7-item nav — fits comfortably at 1100px+. Shrinks at narrower
     desktops, then collapses entirely on tablets and mobile. */
  @media (max-width: 1280px) { .nav-links { gap: 14px; font-size: 12.5px; } }
  @media (max-width: 1100px) { .nav-links { display: none; } }
  @media (max-width: 720px)  { .nav-status { display: none; } }

  /* HERO */
  .hero { padding: 96px 0 32px; text-align: center; }
  .hero-tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 7px 14px 7px 12px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--hairline-2);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.18em; font-weight: 400;
    margin-bottom: 32px;
  }
  .hero-tag .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); animation: pulse 2.4s ease-in-out infinite; }
  .hero h1 {
    font-size: clamp(40px, 6.4vw, 76px);
    font-weight: 500;
    line-height: 1.02;
    letter-spacing: -0.035em;
    margin-bottom: 24px;
    color: var(--text);
  }
  .hero h1 .accent {
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero .lede {
    color: var(--text-2);
    font-size: clamp(15px, 1.2vw, 17px);
    max-width: 580px; margin: 0 auto 64px;
    line-height: 1.65;
    letter-spacing: -0.005em;
  }

  /* COUNTDOWN */
  .countdown {
    display: flex; justify-content: center; gap: 14px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .cd-cell {
    min-width: 120px;
    padding: 22px 14px 16px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.03), transparent 40%),
      linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--line-2);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 12px 28px rgba(0,0,0,0.3);
  }
  .cd-cell::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(245,197,24,0.05), transparent 50%);
    pointer-events: none;
  }
  .cd-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 52px; font-weight: 500;
    color: var(--text); line-height: 1;
    letter-spacing: -0.025em;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum' 1, 'ss01' 1;
  }
  .cd-num.tick { animation: tick .35s cubic-bezier(.2,.7,.2,1); }
  @keyframes tick {
    0% { transform: translateY(-3px); opacity: 0.7; color: var(--gold); }
    100% { transform: translateY(0); opacity: 1; }
  }
  .cd-lbl {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-top: 12px; font-weight: 400;
  }
  .cd-eta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .cd-eta strong { color: var(--text); font-weight: 500; }
  @media (max-width: 720px) {
    .countdown { gap: 8px; }
    .cd-cell { min-width: 0; flex: 1; padding: 16px 8px 12px; }
    .cd-num { font-size: 32px; }
  }

  /* SCRUBBER (full-width, big) */
  .scrub-section { padding: 56px 0 40px; }
  .scrubber-card {
    position: relative;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-2);
    border-radius: 18px;
    padding: 40px 44px 36px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .scrubber-card::before {
    content: ''; position: absolute; top: 0; left: 24%; right: 24%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18) 50%, transparent);
  }
  .scrubber-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 28px; flex-wrap: wrap; gap: 16px;
  }
  .scrubber-title { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em; }
  .scrubber-h2 { font-size: 24px; font-weight: 500; letter-spacing: -0.018em; margin-top: 8px; color: var(--text); }
  .scrubber-hint { font-size: 12px; color: var(--text-3); margin-top: 6px; line-height: 1.5; }
  .scrubber-readout { text-align: right; }
  .scrubber-readout .era { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); font-weight: 400; text-transform: uppercase; letter-spacing: 0.16em; }
  .scrubber-readout .pct { font-family: 'JetBrains Mono', monospace; font-size: 36px; color: var(--gold); font-weight: 500; line-height: 1.05; letter-spacing: -0.025em; margin-top: 6px; }
  .scrubber-readout .date { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2); margin-top: 4px; }

  /* Wrapper that becomes horizontally scrollable on mobile so the timeline
     dots have real breathing room and aren't squeezed into one cluster. */
  .scrub-scroll { overflow: visible; padding-top: 18px; }
  .scrub-track-wrap { position: relative; }
  .scrub-track {
    position: relative;
    height: 64px;
    margin: 8px 0 18px;
    cursor: grab;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .scrub-track:active { cursor: grabbing; }
  @media (max-width: 720px) {
    .scrub-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin: 0 -22px;
      padding: 18px 22px 8px;
      scrollbar-width: thin;
    }
    .scrub-scroll::-webkit-scrollbar { height: 4px; }
    .scrub-scroll::-webkit-scrollbar-thumb { background: rgba(245,197,24,0.3); border-radius: 2px; }
    .scrub-track-wrap { min-width: 720px; }
    .scrub-track { touch-action: pan-x; }
  }
  .scrub-rail {
    position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%);
    height: 3px; background: var(--line-2); border-radius: 3px;
  }
  .scrub-fill {
    position: absolute; top: 50%; left: 0; transform: translateY(-50%);
    height: 3px;
    background: linear-gradient(90deg, var(--gold-3), var(--gold) 60%, var(--gold-2));
    border-radius: 3px;
    box-shadow: 0 0 14px rgba(245, 197, 24, 0.55);
    pointer-events: none;
    transition: width .04s linear;
  }
  .scrub-tick {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--bg-1);
    border: 1.5px solid rgba(245, 197, 24, 0.5);
    pointer-events: auto;
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
  }
  .scrub-tick:hover { transform: translate(-50%, -50%) scale(1.6); border-color: var(--gold); }
  .scrub-tick.passed { background: rgba(245, 197, 24, 0.4); border-color: rgba(245, 197, 24, 0.85); }

  .scrub-tick-tooltip {
    position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--bg-1); border: 1px solid var(--line-2);
    padding: 4px 8px; border-radius: 4px;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text); white-space: nowrap;
    pointer-events: none;
    opacity: 0; transition: opacity .15s;
  }
  .scrub-tick:hover .scrub-tick-tooltip { opacity: 1; }

  .scrub-today {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 2px; height: 30px;
    background: rgba(255,255,255,0.55);
    pointer-events: none;
    z-index: 4;
    will-change: left;
  }
  .scrub-today-label {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: var(--gold); letter-spacing: 0.18em;
    font-weight: 600;
    background: var(--bg-1); padding: 3px 8px; border-radius: 4px;
    white-space: nowrap;
    border: 1px solid rgba(245,197,24,0.45);
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    z-index: 5;
  }

  .scrub-handle {
    position: absolute; top: 50%; transform: translate(-50%, -50%);
    width: 24px; height: 24px; border-radius: 50%;
    background: var(--gold);
    border: 3px solid var(--bg-0);
    box-shadow: 0 0 0 2px var(--gold), 0 0 22px rgba(245, 197, 24, 0.5), 0 6px 14px rgba(0,0,0,0.4);
    cursor: grab;
    z-index: 3;
    transition: box-shadow .2s, transform .04s;
    pointer-events: auto;
    will-change: left;
  }
  /* When NOT dragging, animate handle smoothly to its target (e.g., keyboard
     step, tick click). During drag we want zero lag, so this transition is
     suppressed by the .dragging class. */
  .scrub-handle:not(.dragging) {
    transition: left .25s cubic-bezier(.2,.7,.2,1), box-shadow .2s;
  }
  .scrub-handle::before {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    background: radial-gradient(circle, rgba(245,197,24,0.18), transparent 70%);
    pointer-events: none;
    animation: ripple 3s ease-in-out infinite;
  }
  @keyframes ripple {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.35); opacity: 0; }
  }
  .scrub-handle:active, .scrub-handle.dragging { cursor: grabbing; box-shadow: 0 0 0 5px rgba(245, 197, 24, 0.32), 0 0 36px rgba(245, 197, 24, 0.7), 0 6px 14px rgba(0,0,0,0.4); }
  .scrub-handle.dragging::before { animation: none; opacity: 0; }
  .scrub-handle:focus-visible { outline: 2px solid var(--gold-2); outline-offset: 4px; }

  .scrub-axis {
    display: flex; justify-content: space-between;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-3); padding-top: 4px;
  }

  .scrubber-meta {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px;
    margin-top: 32px; padding-top: 28px; border-top: 1px solid var(--hairline);
  }
  .scrubber-meta-cell { }
  .scrubber-meta-label { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 8px; }
  .scrubber-meta-val { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: var(--text); font-weight: 500; letter-spacing: -0.015em; }
  .scrubber-meta-val.gold { color: var(--gold); }
  @media (max-width: 760px) {
    .scrubber-card { padding: 24px 22px 22px; }
    .scrubber-meta { grid-template-columns: 1fr 1fr; }
  }

  /* SECTIONS */
  section { padding: 96px 0; scroll-margin-top: 80px; position: relative; }
  section::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
    pointer-events: none;
  }
  section:first-of-type::before { display: none; }
  .section-bar {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap;
    padding-bottom: 28px; margin-bottom: 36px;
    border-bottom: 1px solid var(--hairline);
  }
  .section-bar h2 { font-size: clamp(24px, 2.4vw, 32px); font-weight: 500; letter-spacing: -0.02em; color: var(--text); }
  .section-bar p { color: var(--text-2); font-size: 14px; max-width: 560px; margin-top: 6px; line-height: 1.6; }
  .section-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 10px; font-weight: 400; }

  /* NETWORK STATE TILES */
  .net-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 900px) { .net-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 540px) { .net-grid { grid-template-columns: 1fr; } }
  .net-tile {
    padding: 24px 26px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.025), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    transition: border-color .35s var(--ease), transform .35s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease);
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 6px 18px rgba(0,0,0,0.22);
  }
  .net-tile::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(245,197,24,0.5) 50%, transparent);
    opacity: 0;
    transition: opacity .25s;
  }
  .net-tile::after {
    content: ''; position: absolute; bottom: -40%; right: -20%;
    width: 60%; height: 80%;
    background: radial-gradient(circle, rgba(245,197,24,0.06), transparent 65%);
    pointer-events: none;
    transition: opacity .25s;
    opacity: 0.5;
  }
  .net-tile { cursor: pointer; text-align: left; font-family: inherit; color: inherit; }
  .net-tile:hover { border-color: var(--hairline-3); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 14px 32px rgba(0,0,0,0.32); }
  .net-tile:focus-visible { outline: 2px solid rgba(245,197,24,0.5); outline-offset: 2px; }
  .net-tile { transition: border-color .35s var(--ease), transform .15s var(--ease), background .35s var(--ease), box-shadow .35s var(--ease); }
  .net-tile:active { transform: scale(0.985); }
  .net-tile.selected {
    border-color: var(--gold);
    box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 6px 18px rgba(0,0,0,0.22), 0 0 0 1px var(--gold), 0 0 22px rgba(245,197,24,0.18);
  }
  .net-tile-val { transition: color .35s var(--ease), text-shadow .35s var(--ease); }
  .net-tile.selected .net-tile-val { color: var(--gold); text-shadow: 0 0 24px rgba(245,197,24,0.32); }
  .net-tile:hover::before { opacity: 1; }
  .net-tile:hover::after { opacity: 1; }
  .net-tile-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 14px; font-weight: 400; }
  .net-tile-val { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; color: var(--text); line-height: 1.05; letter-spacing: -0.02em; position: relative; }
  .net-tile-val.gold { color: var(--gold); text-shadow: 0 0 24px rgba(245,197,24,0.28); }
  .net-tile-sub { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-3); margin-top: 10px; position: relative; }

  .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-right: 6px; vertical-align: middle; box-shadow: 0 0 8px var(--gold); animation: pulse 2.4s ease-in-out infinite; }

  /* TIMELINE STRIP */
  .timeline-strip {
    display: flex; gap: 10px; overflow-x: auto;
    padding: 6px 2px 18px;
  }
  .timeline-strip::-webkit-scrollbar { height: 6px; }
  .timeline-strip::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 4px; }
  .timeline-strip::-webkit-scrollbar-thumb { background: rgba(245, 197, 24, 0.25); border-radius: 4px; }

  .era-chip {
    flex: 0 0 auto;
    min-width: 148px;
    padding: 18px 20px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .35s var(--ease), background .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
    text-align: left;
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 14px rgba(0,0,0,0.2);
  }
  .era-chip:hover { border-color: var(--hairline-3); background: var(--bg-card-hi); transform: translateY(-1px); }
  .era-chip.active {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(245,197,24,0.08), rgba(245,197,24,0.02));
    box-shadow: inset 0 1px 0 rgba(245,197,24,0.18), 0 8px 24px rgba(245,197,24,0.1);
    transform: translateY(-2px);
  }
  .era-chip.now::before {
    content: ''; position: absolute; top: 10px; right: 10px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .era-chip-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; }
  .era-chip-year { font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 500; color: var(--text); margin-top: 6px; letter-spacing: -0.02em; }
  .era-chip-reward { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); margin-top: 6px; }

  /* DETAIL */
  .detail {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--line-2);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 38px rgba(0,0,0,0.28);
  }
  .detail-head {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 26px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 12px;
  }
  .detail-head-l { display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .detail-head-era { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-3); }
  .detail-head-title { font-size: 18px; font-weight: 600; color: var(--text); }
  .detail-head-date { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2); }
  .detail-nav { display: flex; gap: 4px; }
  .detail-nav button {
    padding: 7px 14px; font-size: 12px; color: var(--text-2);
    border: 1px solid var(--line); border-radius: 6px;
    transition: all .15s; font-family: 'JetBrains Mono', monospace;
  }
  .detail-nav button:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .detail-nav button:disabled { opacity: 0.35; cursor: not-allowed; }

  .detail-rows { display: grid; grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 720px) { .detail-rows { grid-template-columns: 1fr 1fr; } }
  .detail-row { padding: 26px 28px; border-right: 1px solid var(--hairline); border-top: 1px solid var(--hairline); }
  .detail-row:nth-child(3n) { border-right: none; }
  @media (max-width: 720px) {
    .detail-row { border-right: none; border-bottom: 1px solid var(--hairline); }
    .detail-row:nth-child(2n) { border-right: 1px solid var(--hairline); }
  }
  .detail-row .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 10px; font-weight: 400; }
  .detail-row .val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -0.015em; line-height: 1.1; }
  .detail-row .val.gold { color: var(--gold); }
  .detail-row .sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); margin-top: 6px; }

  .detail-progress { padding: 18px 26px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 16px; }
  .detail-progress-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.14em; min-width: 72px; }
  .progress-track { flex: 1; height: 6px; background: rgba(255,255,255,0.06); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold-3), var(--gold) 50%, var(--gold-2)); transition: width .8s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 10px rgba(245,197,24,0.4); }
  .detail-progress-val { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--gold); min-width: 64px; text-align: right; }

  /* CARDS */
  .filter-pills { display: flex; gap: 4px; padding: 4px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 8px; }
  .filter-pills button {
    padding: 7px 14px; font-size: 12px; border-radius: 5px;
    color: var(--text-2); transition: all .15s; font-weight: 500;
  }
  .filter-pills button.active { background: var(--gold); color: #050b1a; }
  .filter-pills button:not(.active):hover { color: var(--text); background: rgba(255,255,255,0.04); }

  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(204px, 1fr));
    gap: 12px;
  }
  .card {
    padding: 20px 22px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    cursor: pointer;
    transition: border-color .35s var(--ease), background .35s var(--ease), transform .35s var(--ease), box-shadow .35s var(--ease);
    text-align: left;
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 14px rgba(0,0,0,0.2);
  }
  .card:hover { border-color: var(--hairline-3); background: var(--bg-card-hi); transform: translateY(-1px); }
  .card.active {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(245,197,24,0.06), rgba(245,197,24,0.01));
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(245,197,24,0.1);
  }
  .card.now::before {
    content: ''; position: absolute; top: 13px; right: 13px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
    animation: pulse 2.4s ease-in-out infinite;
  }
  .card-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); letter-spacing: 0.08em; }
  .card-year { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); margin: 4px 0 14px; letter-spacing: -0.02em; }
  .card-line { display: flex; justify-content: space-between; padding: 7px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; border-top: 1px solid var(--hairline); }
  .card-line .k { color: var(--text-3); }
  .card-line .v { color: var(--text); }
  .card-line .v.gold { color: var(--gold); }

  /* ERA COMPARE */
  .era-compare {
    margin-top: 32px; padding-top: 26px;
    border-top: 1px solid var(--hairline);
  }
  .era-compare-head {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .era-compare-head h3 { font-size: 18px; font-weight: 500; letter-spacing: -0.015em; color: var(--text); margin-top: 4px; }
  .era-compare-pickers {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .era-compare-select {
    padding: 9px 28px 9px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline-2);
    border-radius: 8px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    cursor: pointer;
    min-width: 180px;
    transition: border-color .25s var(--ease), background .25s var(--ease);
    appearance: none;
  }
  .era-compare-select:focus { outline: none; border-color: var(--gold); background: rgba(245,197,24,0.04); }
  .era-compare-select:hover { border-color: var(--hairline-3); }
  .era-compare-select.a { border-color: rgba(245, 197, 24, 0.4); }
  .era-compare-select.b { border-color: rgba(0, 191, 255, 0.4); }
  .era-compare-vs {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em;
  }
  .era-swap-btn, .era-random-btn {
    height: 36px; padding: 0 12px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline-2);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.12em;
    cursor: pointer;
    transition: all .25s var(--ease);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .era-swap-btn { width: 36px; padding: 0; justify-content: center; font-size: 16px; letter-spacing: 0; }
  .era-swap-btn:hover, .era-random-btn:hover {
    background: rgba(245,197,24,0.06);
    border-color: var(--gold);
    color: var(--gold);
  }
  .era-swap-btn:hover { transform: rotate(180deg); }

  .era-compare-table {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
  }
  .ec-header {
    display: grid;
    grid-template-columns: 200px 1.2fr 1.2fr 140px;
    align-items: center;
    padding: 16px 24px;
    background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent);
    border-bottom: 1px solid var(--hairline-2);
    gap: 24px;
  }
  .ec-header .ec-h-metric {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em;
  }
  .ec-header .ec-h-side {
    display: flex; align-items: center; gap: 10px;
  }
  .ec-header .ec-h-dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: 0 0 auto;
    box-shadow: 0 0 10px currentColor;
  }
  .ec-header .ec-h-side.a .ec-h-dot { background: var(--gold); color: var(--gold); }
  .ec-header .ec-h-side.b .ec-h-dot { background: #00BFFF; color: #00BFFF; }
  .ec-header .ec-h-name {
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--text); font-weight: 500; letter-spacing: -0.005em;
  }
  .ec-header .ec-h-side.a .ec-h-name { color: var(--gold); }
  .ec-header .ec-h-side.b .ec-h-name { color: #4FC3FF; }
  .ec-header .ec-h-delta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em;
  }

  .ec-row {
    display: grid;
    grid-template-columns: 200px 1.2fr 1.2fr 140px;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--hairline);
    transition: background .25s var(--ease);
    gap: 24px;
  }
  .ec-row:last-child { border-bottom: none; }
  .ec-row:hover { background: rgba(255,255,255,0.02); }
  .ec-row .ec-metric {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    text-transform: uppercase; letter-spacing: 0.14em;
    color: var(--text-2);
    font-weight: 500;
  }
  .ec-cell {
    display: flex; flex-direction: column; gap: 8px;
    min-width: 0;
  }
  .ec-cell .ec-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.025em;
    line-height: 1;
    transition: color .35s var(--ease);
  }
  .ec-cell .ec-val.gold { color: var(--gold); }
  .ec-cell .ec-bar {
    position: relative;
    height: 5px;
    background: rgba(255,255,255,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .ec-cell .ec-bar-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    border-radius: 3px;
    transition: width .55s cubic-bezier(0.32, 0.72, 0, 1), background .25s var(--ease);
  }
  .ec-cell.a .ec-bar-fill {
    background: linear-gradient(90deg, rgba(245,197,24,0.3), var(--gold));
    box-shadow: 0 0 8px rgba(245,197,24,0.4);
  }
  .ec-cell.b .ec-bar-fill {
    background: linear-gradient(90deg, rgba(0,191,255,0.3), #4FC3FF);
    box-shadow: 0 0 8px rgba(0,191,255,0.35);
  }
  .ec-delta {
    text-align: right;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.015em;
    line-height: 1.1;
    display: inline-flex; align-items: center; justify-content: flex-end; gap: 4px;
    transition: color .35s var(--ease);
  }
  .ec-delta .arrow { font-size: 14px; line-height: 1; }
  .ec-delta.up    { color: #5fcfb8; }
  .ec-delta.down  { color: #FF6B9D; }
  .ec-delta.neutral { color: var(--text-3); }
  .ec-row.highlight-a { background: rgba(245,197,24,0.04); }
  .ec-row.highlight-b { background: rgba(0,191,255,0.04); }

  @media (max-width: 760px) {
    .ec-header, .ec-row {
      grid-template-columns: 1fr 1fr;
      gap: 14px 16px;
      padding: 14px 18px;
    }
    .ec-header .ec-h-metric, .ec-row .ec-metric { grid-column: 1 / -1; }
    .ec-header .ec-h-delta, .ec-row .ec-delta { grid-column: 1 / -1; text-align: left; }
    .ec-cell .ec-val { font-size: 18px; }
  }

  /* CHART */
  .chart-wrap {
    position: relative;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--line-2);
    border-radius: 12px;
    padding: 22px 24px 20px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 16px 38px rgba(0,0,0,0.28);
  }
  /* Chart metric toggle pills */
  .chart-metrics {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 16px;
  }
  .chart-metric-pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--hairline-2);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
  }
  .chart-metric-pill:hover { background: rgba(255,255,255,0.06); border-color: var(--hairline-3); color: var(--text); transform: translateY(-1px); }
  .chart-metric-pill .pill-dot {
    width: 9px; height: 9px; border-radius: 50%;
    flex: 0 0 auto;
  }
  .chart-metric-pill .pill-val {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    opacity: 0.85;
    margin-left: 2px;
  }
  .chart-metric-pill.active { color: var(--text); }

  /* Chart zoom presets */
  .chart-zoom {
    display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    margin-bottom: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }
  .chart-zoom-label {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em;
    margin-right: 6px;
  }
  .chart-zoom-pill {
    padding: 6px 12px;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--hairline-2);
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-2);
    cursor: pointer;
    transition: background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
  }
  .chart-zoom-pill:hover { background: rgba(255,255,255,0.06); border-color: var(--hairline-3); color: var(--text); transform: translateY(-1px); }
  .chart-zoom-pill.active { background: rgba(245,197,24,0.10); border-color: var(--gold); color: var(--gold); }
  .chart-canvas-wrap { position: relative; height: 400px; touch-action: none; user-select: none; -webkit-user-select: none; }
  .chart-canvas-wrap canvas { cursor: grab; }
  .chart-canvas-wrap canvas:active { cursor: grabbing; }
  .chart-readout {
    display: flex; justify-content: space-between; align-items: center;
    padding-bottom: 14px; margin-bottom: 10px; border-bottom: 1px solid var(--line);
    flex-wrap: wrap; gap: 8px;
  }
  .chart-readout-l { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .chart-readout-era { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.14em; }
  .chart-readout-val { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: var(--gold); }
  .chart-readout-meta { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-2); }
  .chart-hint { font-size: 11px; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }

  /* FUNDAMENTALS */
  .fund-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 1040px) { .fund-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 720px)  { .fund-grid { grid-template-columns: 1fr; } }
  .fund-card {
    padding: 32px;
    background:
      linear-gradient(180deg, rgba(255,255,255,0.025), transparent 50%),
      linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    transition: border-color .4s var(--ease), transform .4s var(--ease), box-shadow .4s var(--ease);
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,0.05) inset, 0 8px 22px rgba(0,0,0,0.24);
  }
  .fund-card:hover { border-color: var(--hairline-3); transform: translateY(-1px); box-shadow: 0 1px 0 rgba(255,255,255,0.07) inset, 0 14px 32px rgba(0,0,0,0.32); }
  .fund-card::before {
    content: ''; position: absolute; top: 24px; left: 0; width: 3px; height: 60%;
    background: linear-gradient(180deg, var(--gold), transparent);
    border-radius: 0 2px 2px 0;
    opacity: 0.6;
    transition: opacity .25s, height .25s;
  }
  .fund-card:hover::before { opacity: 1; height: 70%; }
  .fund-card::after {
    content: ''; position: absolute; bottom: -30%; right: -10%;
    width: 50%; height: 70%;
    background: radial-gradient(circle, rgba(245,197,24,0.05), transparent 65%);
    pointer-events: none;
  }
  .fund-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    background: rgba(245,197,24,0.1); color: var(--gold);
    font-family: 'JetBrains Mono', monospace; font-weight: 600;
    font-size: 14px; margin-bottom: 16px;
    border: 1px solid rgba(245,197,24,0.18);
  }
  .fund-card h3 { font-size: 19px; font-weight: 500; letter-spacing: -0.012em; margin-bottom: 10px; color: var(--text); }
  .fund-card p { color: var(--text-2); font-size: 14px; line-height: 1.7; letter-spacing: -0.005em; }
  .fund-card .pill {
    display: inline-block; padding: 3px 10px; margin-top: 14px;
    background: rgba(245,197,24,0.08); border: 1px solid rgba(245,197,24,0.18);
    border-radius: 999px; font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--gold-2);
  }

  /* FAQ */
  .faq-grid { display: grid; gap: 10px; }
  .faq-item {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--line-2);
    border-radius: 10px;
    overflow: hidden;
    transition: border-color .2s, box-shadow .2s;
    box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 4px 12px rgba(0,0,0,0.18);
  }
  .faq-item.open { border-color: rgba(245,197,24,0.3); }
  .faq-q {
    width: 100%; text-align: left;
    padding: 22px 26px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: 500; color: var(--text);
    cursor: pointer;
    transition: background .35s var(--ease);
    letter-spacing: -0.005em;
  }
  .faq-q:hover { background: rgba(255,255,255,0.02); }
  .faq-chevron {
    color: var(--text-3); font-family: 'JetBrains Mono', monospace;
    transition: transform .25s, color .2s;
    font-size: 14px;
  }
  .faq-item.open .faq-chevron { transform: rotate(180deg); color: var(--gold); }
  .faq-a { max-height: 0; overflow: hidden; transition: max-height .35s cubic-bezier(.2,.7,.2,1); }
  .faq-item.open .faq-a { max-height: 500px; }
  .faq-a-inner {
    padding: 0 26px 26px;
    color: var(--text-2); font-size: 14.5px; line-height: 1.75;
    border-top: 1px solid var(--hairline); padding-top: 20px;
    letter-spacing: -0.005em;
  }
  .faq-a-inner strong { color: var(--text); font-weight: 500; }

  /* NOTES */
  .notes { display: grid; grid-template-columns: 1.4fr 1fr; gap: 32px; }
  @media (max-width: 820px) { .notes { grid-template-columns: 1fr; } }
  .notes-prose p { color: var(--text-2); line-height: 1.8; margin-bottom: 18px; font-size: 15px; letter-spacing: -0.005em; }
  .notes-prose p strong { color: var(--text); font-weight: 500; }
  .notes-aside {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    padding: 28px 28px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset;
  }
  .notes-aside h4 { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em; margin-bottom: 20px; font-weight: 400; }
  .notes-aside dl { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
  .notes-aside dt { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); margin-bottom: 4px; letter-spacing: 0.02em; }
  .notes-aside dd { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text); letter-spacing: -0.01em; }

  /* HALVING CARD MODAL */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(5, 11, 26, 0.72);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    animation: backdropIn .3s var(--ease-out);
  }
  @keyframes backdropIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-card {
    position: relative;
    width: min(640px, 100%);
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-3);
    border-radius: 18px;
    padding: 40px 44px 36px;
    box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: modalIn .45s var(--ease-out);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(12px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  .modal-card::before {
    content: ''; position: absolute; top: 0; left: 24%; right: 24%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2) 50%, transparent);
  }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 36px; height: 36px;
    border-radius: 50%;
    color: var(--text-2);
    font-size: 22px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .modal-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }
  .modal-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.18em; }
  .modal-year { font-family: 'JetBrains Mono', monospace; font-size: 64px; font-weight: 500; color: var(--text); margin: 10px 0 6px; line-height: 1; letter-spacing: -0.035em; }
  .modal-date { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--text-2); }
  .modal-divider { height: 1px; background: var(--hairline); margin: 28px 0; }
  .modal-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px 32px;
  }
  .modal-cell { }
  .modal-lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 8px; }
  .modal-val { font-family: 'JetBrains Mono', monospace; font-size: 22px; font-weight: 500; color: var(--text); letter-spacing: -0.018em; line-height: 1.1; }
  .modal-val.gold { color: var(--gold); }
  .modal-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); margin-top: 4px; }
  .modal-progress { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hairline); display: flex; align-items: center; gap: 16px; }
  .modal-progress .lbl { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; min-width: 80px; }
  .modal-progress .val { font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--gold); min-width: 64px; text-align: right; }
  .modal-actions { display: flex; gap: 8px; margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--hairline); }
  .modal-actions button {
    flex: 1; padding: 12px 18px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    font-size: 13px; color: var(--text);
    transition: all .25s var(--ease);
    font-weight: 500;
  }
  .modal-actions button:hover { background: rgba(255,255,255,0.08); border-color: var(--hairline-3); }
  .modal-actions button.primary { background: var(--gold); color: #050b1a; border-color: var(--gold); }
  .modal-actions button.primary:hover { background: var(--gold-2); }
  @media (max-width: 600px) {
    .modal-card { padding: 28px 24px 24px; }
    .modal-year { font-size: 48px; }
    .modal-grid { grid-template-columns: 1fr; gap: 16px; }
  }

  /* CALENDAR */
  .cal-wrap {
    display: grid;
    grid-template-columns: minmax(320px, 0.9fr) 1fr;
    gap: 16px;
  }
  @media (max-width: 820px) { .cal-wrap { grid-template-columns: 1fr; } }
  .cal-card {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    padding: 24px 26px 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
  }
  .cal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding-bottom: 18px; margin-bottom: 14px;
    border-bottom: 1px solid var(--hairline);
  }
  .cal-head-title {
    font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--text); font-weight: 500; letter-spacing: -0.01em;
  }
  .cal-nav { display: flex; gap: 6px; }
  .cal-nav button {
    width: 30px; height: 30px;
    border-radius: 8px;
    color: var(--text-2);
    transition: all .25s var(--ease);
    font-size: 16px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--hairline);
  }
  .cal-nav button:hover { background: rgba(255,255,255,0.04); color: var(--text); border-color: var(--hairline-2); }
  .cal-nav button:disabled { opacity: 0.3; cursor: not-allowed; }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .cal-dow {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.14em;
    text-align: center; padding: 6px 0 10px;
  }
  .cal-day {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
    color: var(--text-2);
    border-radius: 8px;
    border: 1px solid transparent;
    transition: all .2s var(--ease);
    cursor: pointer; position: relative;
  }
  .cal-day:hover:not(:disabled) { background: rgba(255,255,255,0.05); color: var(--text); }
  .cal-day:disabled { opacity: 0.25; cursor: not-allowed; }
  .cal-day.empty { cursor: default; }
  .cal-day.today { color: var(--text); border-color: var(--hairline-2); font-weight: 500; }
  .cal-day.selected { background: var(--gold); color: #050b1a; font-weight: 500; border-color: var(--gold); box-shadow: 0 0 18px rgba(245,197,24,0.3); }
  .cal-day.halving::after {
    content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 3px; height: 3px; border-radius: 50%; background: var(--gold);
  }
  .cal-day.selected.halving::after { background: #050b1a; }
  .cal-legend {
    display: flex; gap: 16px; margin-top: 14px; padding-top: 14px;
    border-top: 1px solid var(--hairline);
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.12em;
    flex-wrap: wrap;
  }
  .cal-legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .cal-legend-dot { width: 8px; height: 8px; border-radius: 50%; border: 1px solid var(--hairline-2); }
  .cal-legend-dot.today { border-color: var(--text-2); }
  .cal-legend-dot.halving { background: var(--gold); border-color: var(--gold); }
  .cal-legend-dot.selected { background: var(--gold); border-color: var(--gold); }
  .cal-shuffle {
    margin-top: 14px;
    width: 100%; padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text); letter-spacing: 0.04em;
    transition: all .25s var(--ease);
  }
  .cal-shuffle:hover { background: rgba(255,255,255,0.08); border-color: var(--hairline-3); }

  .cal-readout {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    padding: 28px 30px 26px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
    display: flex; flex-direction: column;
  }
  .cal-readout-head { padding-bottom: 22px; margin-bottom: 22px; border-bottom: 1px solid var(--hairline); }
  .cal-readout-tag { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.18em; }
  .cal-readout-date { font-family: 'JetBrains Mono', monospace; font-size: 28px; font-weight: 500; color: var(--text); margin: 8px 0 4px; letter-spacing: -0.022em; line-height: 1.05; }
  .cal-readout-day { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--gold); }
  .cal-readout-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px;
    margin-bottom: 20px;
  }
  .cal-readout-cell { }
  .cal-readout-lbl { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 6px; }
  .cal-readout-val { font-family: 'JetBrains Mono', monospace; font-size: 17px; color: var(--text); font-weight: 500; letter-spacing: -0.015em; line-height: 1.1; }
  .cal-readout-val.gold { color: var(--gold); }
  .cal-readout-sub { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); margin-top: 3px; }
  .cal-fact {
    margin-top: auto;
    padding: 14px 16px;
    background: rgba(245, 197, 24, 0.04);
    border: 1px solid rgba(245, 197, 24, 0.16);
    border-radius: 10px;
    font-size: 12.5px; line-height: 1.55;
    color: var(--text-2);
  }
  .cal-fact strong { color: var(--gold); font-weight: 500; }
  .cal-prefuture-note {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-3);
    padding: 10px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }

  /* SPEED OF NEXA — GLOBE */
  .globe-section { position: relative; }
  .globe-grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 16px;
    align-items: stretch;
  }
  @media (max-width: 880px) { .globe-grid { grid-template-columns: 1fr; } }

  .globe-controls {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    padding: 24px 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
    display: flex; flex-direction: column; gap: 14px;
    position: relative; z-index: 5;
  }
  .globe-control-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.16em;
    margin-bottom: 6px;
  }
  .city-input-wrap { position: relative; }
  .city-input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit; font-size: 14px;
    transition: border-color .25s var(--ease), background .25s var(--ease);
    outline: none;
  }
  .city-input::placeholder { color: var(--text-3); }
  .city-input:focus { border-color: var(--gold); background: rgba(255,255,255,0.04); }
  .city-input.has-value { border-color: var(--hairline-3); color: var(--text); }

  .city-suggestions {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: var(--bg-1);
    border: 1px solid var(--hairline-2);
    border-radius: 10px;
    box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    max-height: 240px; overflow-y: auto;
    z-index: 20;
    animation: detailIn .2s var(--ease-out);
  }
  .city-suggestion {
    width: 100%; text-align: left;
    padding: 10px 14px;
    font-size: 13px; color: var(--text);
    transition: background .15s var(--ease);
    display: flex; justify-content: space-between; align-items: center;
    border: none; background: none; cursor: pointer;
    font-family: inherit;
  }
  .city-suggestion:hover { background: rgba(245,197,24,0.08); }
  .city-suggestion .country {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em;
  }

  .send-btn {
    margin-top: 4px;
    padding: 13px 18px;
    background: var(--gold);
    color: #050b1a;
    border: 1px solid var(--gold);
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    transition: all .25s var(--ease);
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.02em;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .send-btn:hover:not(:disabled) { background: var(--gold-2); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,197,24,0.3); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; background: rgba(255,255,255,0.06); color: var(--text-3); border-color: var(--hairline-2); }

  .tx-status {
    margin-top: 8px; padding: 12px 14px;
    background: rgba(245,197,24,0.04);
    border: 1px solid rgba(245,197,24,0.16);
    border-radius: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-2); line-height: 1.6;
  }
  .tx-status strong { color: var(--gold); font-weight: 500; }
  .tx-status .ts-row { display: flex; justify-content: space-between; padding: 3px 0; }
  .tx-status .ts-k { color: var(--text-3); }

  .globe-canvas-wrap {
    position: relative;
    background: linear-gradient(180deg, #050b1a, #08122a);
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    overflow: hidden;
    aspect-ratio: 1.2 / 1;
    min-height: 480px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.3);
  }
  @media (max-width: 600px) { .globe-canvas-wrap { aspect-ratio: 1 / 1; min-height: 380px; } }

  .code-rain {
    position: absolute; inset: 0;
    overflow: hidden; pointer-events: none;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px; line-height: 1.4;
    user-select: none; -webkit-user-select: none;
    z-index: 1;
  }
  .code-col {
    position: absolute; top: -100%;
    color: rgba(245, 197, 24, 0.10);
    white-space: pre;
    animation-name: codeRain; animation-timing-function: linear; animation-iteration-count: infinite;
  }
  @keyframes codeRain {
    from { transform: translateY(0); }
    to   { transform: translateY(220%); }
  }

  .globe-svg {
    position: relative; z-index: 2;
    width: 100%; height: 100%;
    display: block;
  }
  .globe-svg .sphere { fill: rgba(8, 18, 42, 0.6); }
  .globe-svg .graticule { fill: none; stroke: rgba(245, 197, 24, 0.06); stroke-width: 0.5; }
  .globe-svg .country { fill: rgba(245, 197, 24, 0.08); stroke: rgba(245, 197, 24, 0.45); stroke-width: 0.6; stroke-linejoin: round; transition: fill .3s; }
  .globe-svg .country.highlight { fill: rgba(245, 197, 24, 0.18); }
  .globe-svg .glow-ring { fill: none; stroke: rgba(245, 197, 24, 0.18); stroke-width: 1; }
  .globe-svg .arc-line { fill: none; stroke: var(--gold); stroke-width: 1.6; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(245, 197, 24, 0.7)); }
  .globe-svg .arc-line.faint { stroke: rgba(245, 197, 24, 0.25); stroke-width: 1; filter: none; }
  .globe-svg .city-pin { fill: var(--gold); }
  .globe-svg .city-pin-halo { fill: none; stroke: var(--gold); stroke-width: 1.5; opacity: 0.6; }
  .globe-svg .city-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; fill: var(--text); letter-spacing: 0.04em;
    text-transform: uppercase;
    pointer-events: none;
  }
  .globe-svg .tx-dot { fill: var(--gold); filter: drop-shadow(0 0 6px rgba(245, 197, 24, 0.9)); }
  .globe-svg .tx-trail { fill: none; stroke: var(--gold); stroke-width: 2.4; stroke-linecap: round; opacity: 0.95; filter: drop-shadow(0 0 6px rgba(245, 197, 24, 0.85)); }
  .globe-svg .tx-arrow { fill: var(--gold); stroke: #fff8d8; stroke-width: 0.6; filter: drop-shadow(0 0 12px rgba(245, 197, 24, 1)) drop-shadow(0 0 4px rgba(255, 220, 100, 0.9)); }
  .globe-svg .tx-impact { fill: none; stroke: var(--gold); stroke-width: 2; opacity: 0; }
  .globe-svg .tx-impact.go { animation: txImpact .8s var(--ease-out) forwards; }
  .globe-svg .tx-impact.go.delay-1 { animation-delay: .12s; }
  .globe-svg .tx-impact.go.delay-2 { animation-delay: .24s; }
  @keyframes txImpact {
    0%   { opacity: 1; r: 5; stroke-width: 4; }
    100% { opacity: 0; r: 50; stroke-width: 0.5; }
  }
  .globe-svg .tx-spark { filter: drop-shadow(0 0 5px rgba(245,197,24,0.9)); }

  @keyframes pulseHalo {
    0%   { r: 4; opacity: 0.7; }
    100% { r: 14; opacity: 0; }
  }
  .globe-svg .city-pin-halo.pulse { animation: pulseHalo 2s ease-out infinite; }

  .globe-overlay-tag {
    position: absolute; top: 14px; left: 16px;
    z-index: 3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.18em;
    background: rgba(5, 11, 26, 0.6);
    backdrop-filter: blur(8px);
    padding: 5px 10px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
  }
  .globe-overlay-tag.live { color: var(--gold); border-color: rgba(245,197,24,0.3); }
  .globe-overlay-tag.live::before {
    content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold); margin-right: 6px;
    vertical-align: middle;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .globe-demo-tag {
    position: absolute; top: 14px; right: 16px;
    z-index: 3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.18em;
    background: rgba(5, 11, 26, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 5px 12px;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 8px;
    pointer-events: none;
  }
  .globe-demo-tag .sep { color: var(--text-3); opacity: 0.5; }
  .globe-demo-tag .v { color: var(--gold); font-weight: 500; }
  .globe-footnote {
    margin-top: 10px;
    font-size: 12px; color: var(--text-3); line-height: 1.55;
    letter-spacing: -0.005em;
  }
  .globe-footnote strong { color: var(--gold); font-weight: 500; }
  .globe-coords {
    position: absolute; bottom: 14px; right: 16px;
    z-index: 3;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    background: rgba(5, 11, 26, 0.6);
    backdrop-filter: blur(8px);
    padding: 6px 10px;
    border: 1px solid var(--hairline);
    border-radius: 6px;
    line-height: 1.5;
  }
  .globe-coords .v { color: var(--text-2); }

  /* LIVE BLOCKCHAIN VIZ */
  .chain-wrap {
    position: relative;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    padding: 28px 0 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
    overflow: hidden;
  }
  .chain-wrap::before, .chain-wrap::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 60px;
    pointer-events: none; z-index: 2;
  }
  .chain-wrap::before { left: 0; background: linear-gradient(90deg, var(--bg-card) 30%, transparent); }
  .chain-wrap::after  { right: 0; background: linear-gradient(-90deg, var(--bg-card) 30%, transparent); }
  .chain-arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    z-index: 5;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(15, 28, 54, 0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--hairline-3);
    color: var(--text);
    font-size: 22px; line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .25s var(--ease), border-color .25s var(--ease), color .25s var(--ease), transform .15s var(--ease);
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
    font-family: 'JetBrains Mono', monospace;
  }
  .chain-arrow:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-50%) scale(1.05); }
  .chain-arrow:active { transform: translateY(-50%) scale(0.95); }
  .chain-arrow.left  { left: 14px; }
  .chain-arrow.right { right: 14px; }
  .chain-arrow.live::after {
    content: ''; position: absolute; top: 4px; right: 4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .chain {
    display: flex; align-items: stretch;
    overflow-x: auto;
    padding: 8px 36px 14px;
    scroll-behavior: smooth;
    user-select: none; -webkit-user-select: none;
    cursor: grab;
    touch-action: pan-y;
  }
  .chain.dragging { cursor: grabbing; }
  .chain::-webkit-scrollbar { height: 5px; }
  .chain::-webkit-scrollbar-track { background: rgba(255,255,255,0.02); }
  .chain::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 5px; }
  .chain::-webkit-scrollbar-thumb:hover { background: var(--hairline-3); }

  .block {
    flex: 0 0 auto;
    width: 156px;
    padding: 18px 16px 14px;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-0));
    border: 1px solid rgba(245, 197, 24, 0.36);
    border-radius: 10px;
    cursor: pointer;
    transition: transform .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);
    position: relative;
    text-align: left;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 4px 14px rgba(0,0,0,0.25);
  }
  .block:hover { transform: translateY(-2px); border-color: rgba(245, 197, 24, 0.65); }
  .block.active { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 8px 22px rgba(245,197,24,0.22); transform: translateY(-2px); }
  .block-tag {
    position: absolute; top: -8px; left: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px; font-weight: 500;
    background: var(--bg-card);
    padding: 2px 7px;
    border: 1px solid rgba(245, 197, 24, 0.36);
    border-radius: 4px;
    color: var(--text-3);
    letter-spacing: 0.14em;
    z-index: 3;
  }
  .block-height {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; font-weight: 500;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .block-hash {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-3);
    margin-bottom: 12px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .block-meta {
    display: grid; grid-template-columns: auto 1fr; column-gap: 10px; row-gap: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
  }
  .block-meta .k { color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .block-meta .v { color: var(--text-2); text-align: right; }

  /* Block found animation */
  @keyframes blockFound {
    0%   { transform: scale(0.88) translateY(10px); opacity: 0; box-shadow: 0 0 0 0 rgba(245,197,24,0.6); }
    35%  { transform: scale(1.02) translateY(0); opacity: 1; box-shadow: 0 0 0 8px rgba(245,197,24,0); }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  .block.fresh { animation: blockFound .8s cubic-bezier(0.32, 0.72, 0, 1); }

  /* Chain link between blocks */
  .chain-link {
    flex: 0 0 auto;
    width: 26px;
    align-self: center;
    height: 1px;
    background: linear-gradient(90deg, var(--hairline-2), var(--hairline-3) 50%, var(--hairline-2));
    position: relative;
    margin: 0 -1px;
  }
  .chain-link::before, .chain-link::after {
    content: ''; position: absolute; top: 50%; transform: translateY(-50%);
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 6px rgba(245,197,24,0.5);
  }
  .chain-link::before { left: -2px; }
  .chain-link::after { right: -2px; }

  /* Mining block */
  .block.mining {
    /* underlying border kept faint — the SVG progress border paints over it */
    border-color: rgba(245, 197, 24, 0.18);
    background: linear-gradient(180deg, rgba(245,197,24,0.05), var(--bg-0));
  }
  .block.mining .block-tag {
    color: var(--gold);
    border-color: rgba(245, 197, 24, 0.55);
    background: var(--bg-1);
  }
  .mining-sweep-wrap {
    position: absolute; inset: 0;
    border-radius: 10px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .mining-sweep {
    position: absolute; top: 0; bottom: 0; left: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent 0%, rgba(245,197,24,0.20) 50%, transparent 100%);
    animation: miningSweep 2.6s linear infinite;
  }
  @keyframes miningSweep {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }
  .block.mining .block-height { color: var(--gold); position: relative; z-index: 2; }
  .block.mining .block-hash {
    color: var(--gold);
    opacity: 0.85;
    position: relative; z-index: 2;
  }
  .block.mining .block-meta { position: relative; z-index: 2; }

  /* Animated progress border that traces around the mining block */
  .mining-border {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
    z-index: 1;
  }
  .mining-border rect {
    fill: none;
    stroke: var(--gold);
    stroke-width: 2;
    filter: drop-shadow(0 0 6px rgba(245, 197, 24, 0.7));
    transition: stroke-dashoffset .12s linear;
  }

  /* Block detail panel */
  .block-detail {
    margin-top: 14px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 12px;
    padding: 24px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px 32px;
    position: relative;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
    animation: detailIn .4s var(--ease-out);
  }
  @keyframes detailIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @media (max-width: 720px) { .block-detail { grid-template-columns: 1fr 1fr; gap: 14px 22px; padding: 20px 22px; } }
  .block-detail .span2 { grid-column: span 2; }
  .block-detail .span3 { grid-column: 1 / -1; }
  .block-detail .lbl {
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em;
    margin-bottom: 6px;
  }
  .block-detail .val {
    font-family: 'JetBrains Mono', monospace; font-size: 14px;
    color: var(--text); word-break: break-all;
    letter-spacing: -0.005em;
  }
  .block-detail .val.gold { color: var(--gold); }
  .block-detail .val.big { font-size: 18px; letter-spacing: -0.02em; }
  .sim-flag { color: rgba(245,197,24,0.7); font-size: 9px; font-weight: 500; letter-spacing: 0.12em; margin-left: 4px; }
  .block-detail-close {
    position: absolute; top: 14px; right: 14px;
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); font-size: 18px; line-height: 1;
    transition: background .25s var(--ease), color .25s var(--ease);
  }
  .block-detail-close:hover { background: rgba(255,255,255,0.06); color: var(--text); }

  .chain-count-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: -4px 0 16px;
  }
  .chain-count-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em;
    margin-right: 4px;
  }
  .chain-count-pill {
    background: rgba(255,255,255,0.03);
    color: var(--text-2);
    border: 1px solid var(--hairline);
    padding: 6px 14px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s;
  }
  .chain-count-pill:hover { background: rgba(255,255,255,0.06); border-color: var(--hairline-2); }
  .chain-count-pill.active {
    background: var(--gold);
    color: #0a0e1f;
    border-color: var(--gold);
  }
  .chain-count-hint {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace; font-size: 10px;
    color: var(--text-3); letter-spacing: 0.06em;
  }
  @media (max-width: 720px) {
    .chain-count-hint { width: 100%; margin-left: 0; }
  }

  .chain-status {
    display: flex; align-items: center; gap: 10px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text-2);
  }
  .chain-status .pct { color: var(--gold); font-weight: 500; min-width: 60px; text-align: right; }
  .chain-status .eta { color: var(--text-3); }

  /* COIN RACE */
  .race-card {
    position: relative;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-card));
    border: 1px solid var(--hairline-2);
    border-radius: 14px;
    padding: 26px 28px 22px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.04) inset, 0 8px 22px rgba(0,0,0,0.22);
    overflow: hidden;
  }
  .race-pickers {
    display: flex; flex-wrap: wrap; gap: 6px;
    margin-bottom: 18px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--hairline);
  }
  .coin-chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 6px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline-2);
    border-radius: 999px;
    font-family: inherit; font-size: 12px;
    color: var(--text-2);
    transition: background .25s var(--ease), border-color .25s var(--ease), transform .15s var(--ease), opacity .25s var(--ease);
    cursor: pointer;
  }
  .coin-chip:hover:not(:disabled) { background: rgba(255,255,255,0.05); }
  .coin-chip:disabled { opacity: 0.32; cursor: not-allowed; }
  .coin-chip.selected { color: var(--text); }
  .coin-chip-badge {
    width: 22px; height: 22px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 700;
    line-height: 1;
  }
  .coin-chip-tps {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    margin-left: 2px;
  }

  .race-tracks {
    display: flex; flex-direction: column;
    gap: 8px;
    margin-bottom: 18px;
  }
  .race-track-row {
    display: flex; align-items: stretch;
    background: linear-gradient(180deg, rgba(255,255,255,0.025), rgba(255,255,255,0.01));
    border: 1px solid var(--hairline);
    border-radius: 10px;
    height: 56px;
    overflow: hidden;
    transition: border-color .35s var(--ease), background .35s var(--ease);
  }
  .race-track-row.winner {
    background: linear-gradient(180deg, rgba(245,197,24,0.05), rgba(255,255,255,0.01));
  }
  .race-coin-info {
    flex: 0 0 138px;
    display: flex; align-items: center; gap: 10px;
    padding: 0 14px;
    border-right: 1px solid var(--hairline);
  }
  .race-coin-badge {
    width: 26px; height: 26px;
    border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px; font-weight: 700;
    line-height: 1;
    flex: 0 0 auto;
  }
  .race-coin-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .race-coin-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text); font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1;
  }
  .race-coin-tps {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    line-height: 1;
  }
  .race-lane {
    flex: 1; position: relative;
    overflow: hidden;
  }
  .race-lane-line {
    position: absolute; top: 50%; left: 16px; right: 28px;
    height: 1.5px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,0.10) 0 8px, transparent 8px 16px);
    transform: translateY(-50%);
    pointer-events: none;
  }
  .race-lane-track {
    position: absolute; top: 50%; left: 16px; right: 28px;
    height: 36px;
    transform: translateY(-50%);
  }
  .race-trail {
    position: absolute; top: 50%;
    left: 0; height: 3px;
    transform: translateY(-50%);
    border-radius: 3px;
    pointer-events: none;
    opacity: 0;
    transition: opacity .25s var(--ease);
  }
  .race-trail.live { opacity: 0.9; }

  /* Sports car — replaces the round badge */
  .race-car-svg {
    position: absolute; top: 50%;
    width: 70px; height: 28px;
    transform: translate(-50%, -50%);
    z-index: 2;
    will-change: left;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4));
    pointer-events: none;
  }
  .race-car-svg.racing { animation: carBob 0.32s ease-in-out infinite; }
  @keyframes carBob {
    0%, 100% { transform: translate(-50%, calc(-50% - 1px)); }
    50%      { transform: translate(-50%, calc(-50% + 1px)); }
  }
  .race-car-svg.winner { animation: carCelebrate 0.7s ease-in-out infinite; filter: drop-shadow(0 4px 12px rgba(245,197,24,0.6)); }
  @keyframes carCelebrate {
    0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
    50%      { transform: translate(-50%, calc(-50% - 3px)) rotate(2deg); }
  }
  .race-car-svg svg { display: block; width: 100%; height: 100%; }
  .car-exhaust {
    position: absolute; top: 50%; right: -6px;
    width: 14px; height: 6px; transform: translateY(-50%);
    background: radial-gradient(ellipse, rgba(245,197,24,0.6) 0%, transparent 70%);
    opacity: 0; pointer-events: none;
    border-radius: 50%;
  }
  .race-car-svg.racing .car-exhaust { opacity: 1; animation: exhaustPuff 0.4s ease-out infinite; }
  @keyframes exhaustPuff {
    0%   { transform: translateY(-50%) scaleX(0.8); opacity: 0.7; }
    100% { transform: translateY(-50%) translateX(8px) scaleX(1.6); opacity: 0; }
  }

  /* Garage */
  .race-garage {
    margin-bottom: 18px; padding-bottom: 18px;
    border-bottom: 1px solid var(--hairline);
  }
  .race-garage-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-bottom: 12px;
  }
  .garage-grid {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .garage-row {
    display: flex; align-items: center; gap: 16px;
    padding: 6px 12px 6px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline);
    border-radius: 9px;
