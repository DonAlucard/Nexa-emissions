    transition: background .25s var(--ease), border-color .25s var(--ease);
  }
  .garage-row:hover { background: rgba(255,255,255,0.035); border-color: var(--hairline-2); }
  .garage-coin-label {
    flex: 0 0 92px;
    display: flex; align-items: center; gap: 9px;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--text);
    border-right: 1px solid var(--hairline);
    padding-right: 12px;
    align-self: stretch;
  }
  .garage-coin-label .badge {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; line-height: 1;
    flex: 0 0 auto;
  }
  .garage-options {
    display: grid;
    grid-template-columns: repeat(4, minmax(64px, 100px));
    gap: 6px;
    flex: 1;
  }
  .garage-car {
    height: 44px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline-2);
    border-radius: 8px;
    cursor: pointer;
    transition: background .25s var(--ease), border-color .25s var(--ease), transform .15s var(--ease), opacity .25s var(--ease);
    display: flex; align-items: center; justify-content: center;
    padding: 4px 6px;
    font-family: inherit;
    opacity: 0.55;
  }
  .garage-car:hover:not(:disabled) { background: rgba(255,255,255,0.05); border-color: var(--hairline-3); transform: translateY(-1px); opacity: 0.85; }
  .garage-car:disabled { cursor: not-allowed; }
  .garage-car.active { background: rgba(245,197,24,0.05); opacity: 1; }
  .garage-car svg { display: block; height: 100%; max-height: 30px; width: auto; }
  @media (max-width: 540px) {
    .garage-row { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px; }
    .garage-coin-label { border-right: none; padding-right: 0; padding-bottom: 6px; border-bottom: 1px solid var(--hairline); }
    .garage-options { grid-template-columns: repeat(2, 1fr); }
  }

  /* Countdown overlay */
  .race-countdown-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(5, 11, 26, 0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 50;
    pointer-events: none;
  }
  .countdown-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: clamp(96px, 16vw, 180px);
    font-weight: 700;
    color: var(--gold);
    text-shadow: 0 0 60px rgba(245, 197, 24, 0.7), 0 0 24px rgba(245, 197, 24, 0.9);
    letter-spacing: -0.05em;
    animation: cdPop .9s cubic-bezier(0.32, 0.72, 0, 1);
    line-height: 1;
  }
  .countdown-num.go {
    font-size: clamp(72px, 12vw, 140px);
    animation: cdGo .9s cubic-bezier(0.32, 0.72, 0, 1);
  }
  @keyframes cdPop {
    0%   { transform: scale(0.4); opacity: 0; }
    18%  { transform: scale(1.25); opacity: 1; }
    60%  { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes cdGo {
    0%   { transform: scale(0.4); opacity: 0; letter-spacing: -0.1em; }
    20%  { transform: scale(1.3); opacity: 1; letter-spacing: -0.05em; }
    60%  { transform: scale(1.1); opacity: 1; letter-spacing: 0.02em; }
    100% { transform: scale(2); opacity: 0; letter-spacing: 0.2em; }
  }
  .race-finish-line {
    position: absolute; top: 0; right: 12px; bottom: 0;
    width: 8px;
    background: repeating-linear-gradient(
      -45deg,
      var(--gold) 0, var(--gold) 4px,
      rgba(0,0,0,0.4) 4px, rgba(0,0,0,0.4) 8px
    );
    border-radius: 1px;
    z-index: 1;
    opacity: 0.85;
  }

  .race-controls {
    display: flex; align-items: center; gap: 10px;
    flex-wrap: wrap;
  }
  .race-btn {
    padding: 11px 22px;
    background: var(--gold);
    color: #050b1a;
    border: 1px solid var(--gold);
    border-radius: 10px;
    font-size: 13px; font-weight: 600;
    transition: background .25s var(--ease), transform .25s var(--ease), box-shadow .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .race-btn:hover:not(:disabled) { background: var(--gold-2); transform: translateY(-1px); box-shadow: 0 8px 24px rgba(245,197,24,0.3); }
  .race-btn:disabled { opacity: 0.35; cursor: not-allowed; box-shadow: none; }
  .race-btn.ghost {
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-color: var(--hairline-2);
  }
  .race-btn.ghost:hover:not(:disabled) { background: rgba(255,255,255,0.08); border-color: var(--hairline-3); box-shadow: none; }
  .race-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; color: var(--text-2);
  }
  .race-status .winner-name { color: var(--gold); font-weight: 500; }
  .race-podium {
    margin-top: 16px;
    background: rgba(245, 197, 24, 0.04);
    border: 1px solid rgba(245, 197, 24, 0.18);
    border-radius: 10px;
    padding: 16px 18px 14px;
  }
  .race-podium-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.18em;
    margin-bottom: 10px;
  }
  .race-podium-row {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--hairline);
    font-family: 'JetBrains Mono', monospace; font-size: 13px;
  }
  .race-podium-row:first-of-type { border-top: none; padding-top: 4px; }
  .race-podium-row .place {
    color: var(--text-3); width: 22px; flex: 0 0 auto;
  }
  .race-podium-row.gold .place { color: var(--gold); font-weight: 500; }
  .race-podium-row .name { color: var(--text); flex: 1; min-width: 0; }
  .race-podium-row .name .tps { color: var(--text-3); font-size: 11px; margin-left: 8px; }
  .race-podium-row .time { color: var(--text-2); flex: 0 0 auto; }
  .race-podium-row.gold .time { color: var(--gold); }
  .race-footnote {
    margin-top: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; color: var(--text-3);
    letter-spacing: 0.04em;
  }

  /* SHARE */
  .share-row { display: inline-flex; gap: 8px; flex-wrap: wrap; }
  .share-row.center { justify-content: center; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px; font-weight: 500;
    transition: background .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease), color .25s var(--ease);
    border: 1px solid transparent;
    font-family: inherit;
    line-height: 1;
  }
  .share-btn svg { display: block; }
  .share-btn.x {
    background: var(--text);
    color: #050b1a;
    border-color: var(--text);
  }
  .share-btn.x:hover { background: #ffffff; border-color: #ffffff; transform: translateY(-1px); }
  .share-btn.copy {
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border-color: var(--hairline-2);
  }
  .share-btn.copy:hover { background: rgba(255,255,255,0.08); border-color: var(--hairline-3); transform: translateY(-1px); }
  .share-btn.compact { padding: 8px 12px; font-size: 12px; gap: 6px; }

  .hero-share {
    margin-top: 16px;
    display: flex; justify-content: center; gap: 8px;
  }
  .cal-share { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cal-share-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; }
  .modal-share { margin-top: 24px; padding-top: 22px; border-top: 1px solid var(--hairline); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .modal-share-label { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-3);
    color: var(--text);
    padding: 12px 20px;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    box-shadow: 0 16px 36px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.06);
    animation: toastIn .35s var(--ease-out);
    z-index: 200;
    display: inline-flex; align-items: center; gap: 10px;
    letter-spacing: -0.005em;
  }
  .toast::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: var(--gold); box-shadow: 0 0 8px var(--gold);
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translate(-50%, 10px); }
    to   { opacity: 1; transform: translate(-50%, 0); }
  }

  /* BLOCK ART */
  .art-stage { display: flex; flex-direction: column; gap: 32px; }
  .art-hero {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 36px;
    align-items: center;
    padding: 28px;
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-2);
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  .art-hero-frame {
    position: relative;
    width: 420px; height: 420px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
    animation: artFadeIn .9s cubic-bezier(.2,.7,.2,1);
  }
  .art-hero-frame svg.block-art { display: block; width: 100%; height: 100%; }
  @keyframes artFadeIn {
    0% { opacity: 0; transform: scale(0.85) rotate(-8deg); filter: blur(4px); }
    60% { opacity: 1; transform: scale(1.02) rotate(2deg); filter: blur(0); }
    100% { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); }
  }
  .art-hero-meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .art-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.18em; }
  .art-height { font-family: 'JetBrains Mono', monospace; font-size: 32px; font-weight: 500; color: var(--text); letter-spacing: -0.025em; line-height: 1.05; }
  .art-hash { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-3); word-break: break-all; line-height: 1.4; }
  .art-time { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
  .art-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .art-btn {
    background: rgba(255,255,255,0.04);
    color: var(--text);
    border: 1px solid var(--hairline-2);
    padding: 9px 16px;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: transform .15s, background .15s, border-color .15s;
  }
  .art-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); border-color: var(--hairline); }
  .art-btn.primary {
    background: var(--gold);
    color: #0a0e1f;
    border-color: var(--gold);
  }
  .art-btn.primary:hover { background: #fff080; border-color: #fff080; }
  .art-btn.ghost { background: transparent; color: var(--text-3); }
  .art-explainer { margin-top: 12px; font-size: 12px; color: var(--text-3); line-height: 1.55; }

  .art-gallery { padding: 4px 0; }
  .art-gallery-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.16em;
    margin-bottom: 12px;
  }
  .art-gallery-row {
    display: flex;
    gap: 12px;
    overflow-x: auto;
    padding: 6px 4px 12px;
    scrollbar-width: thin;
    scrollbar-color: var(--hairline-2) transparent;
  }
  .art-gallery-row::-webkit-scrollbar { height: 6px; }
  .art-gallery-row::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 3px; }
  .art-gallery-row::-webkit-scrollbar-track { background: transparent; }
  .art-thumb {
    flex-shrink: 0;
    width: 100px;
    background: none;
    border: 2px solid transparent;
    border-radius: 10px;
    padding: 4px;
    cursor: pointer;
    transition: transform .15s, border-color .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .art-thumb svg.block-art { display: block; width: 88px; height: 88px; border-radius: 6px; }
  .art-thumb-h { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-3); }
  .art-thumb:hover { transform: translateY(-2px); border-color: var(--hairline); }
  .art-thumb.active { border-color: var(--gold); }
  .art-thumb.active .art-thumb-h { color: var(--gold); }
  @media (max-width: 720px) {
    .art-hero { grid-template-columns: 1fr; gap: 20px; padding: 16px; }
    .art-hero-frame { width: 100%; max-width: 360px; height: auto; aspect-ratio: 1; margin: 0 auto; }
    .art-height { font-size: 24px; }
    .art-thumb { width: 84px; }
    .art-thumb svg.block-art { width: 72px; height: 72px; }
  }

  /* SOUNDS OF NEXA */
  .sound-toggle { display: flex; align-items: center; gap: 10px; }
  .sound-stage { display: flex; flex-direction: column; gap: 18px; }
  .sound-perf-card {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-2);
    border-radius: 16px;
    padding: 24px 22px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .sound-perf-card .sound-genres { padding-bottom: 18px; border-bottom: 1px solid var(--hairline); margin-bottom: 18px; }
  .sound-genres-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 12px;
  }
  .sound-genres-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .sound-genre {
    background: rgba(255,255,255,0.03);
    color: var(--text-2);
    border: 1px solid var(--hairline);
    padding: 8px 14px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s, transform .15s;
  }
  .sound-genre:hover { background: rgba(255,255,255,0.07); border-color: var(--hairline-2); transform: translateY(-1px); }
  .sound-genre.active {
    background: var(--gold);
    color: #0a0e1f;
    border-color: var(--gold);
    box-shadow: 0 4px 14px rgba(245,197,24,0.3);
  }
  .sound-keys-label {
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.16em; margin-bottom: 12px;
  }
  .sound-auto { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; cursor: pointer; }
  .sound-auto input { accent-color: var(--gold); }
  .sound-keys-row {
    display: flex; gap: 10px; overflow-x: auto; padding: 4px 4px 12px;
    scrollbar-width: thin; scrollbar-color: var(--hairline-2) transparent;
  }
  .sound-keys-row::-webkit-scrollbar { height: 6px; }
  .sound-keys-row::-webkit-scrollbar-thumb { background: var(--hairline-2); border-radius: 3px; }
  .sound-key {
    position: relative; flex-shrink: 0;
    width: 110px; padding: 12px 10px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--hairline);
    border-radius: 12px;
    color: var(--text-2);
    cursor: not-allowed; opacity: 0.55;
    transition: transform .12s, background .15s, border-color .15s;
    display: flex; flex-direction: column; gap: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .sound-key.live { cursor: pointer; opacity: 1; }
  .sound-key.live:hover { background: rgba(245,197,24,0.06); border-color: rgba(245,197,24,0.5); transform: translateY(-2px); }
  .sound-key.live:active { transform: translateY(0); background: rgba(245,197,24,0.14); }
  .sound-key-era { font-size: 9px; color: var(--gold); text-transform: uppercase; letter-spacing: 0.18em; }
  .sound-key-h { font-size: 14px; color: var(--text); font-weight: 500; letter-spacing: -0.02em; }
  .sound-key-inst { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.1em; }
  .sound-key-add {
    position: absolute; top: 6px; right: 8px;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(245,197,24,0.15);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: background .15s, transform .15s;
  }
  .sound-key-add:hover { background: var(--gold); color: #0a0e1f; transform: scale(1.15); }

  .sound-bench-card {
    background: linear-gradient(180deg, var(--bg-2), var(--bg-1));
    border: 1px solid var(--hairline-2);
    border-radius: 16px;
    padding: 20px 22px;
  }
  .sound-bench-head {
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    flex-wrap: wrap; margin-bottom: 16px;
  }
  .sound-bench-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--gold);
    text-transform: uppercase; letter-spacing: 0.18em;
  }
  .sound-bench-sub { font-size: 12px; color: var(--text-3); margin-top: 4px; max-width: 480px; }
  .sound-bench-controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .sound-bench-row {
    display: flex; gap: 8px; flex-wrap: wrap; min-height: 64px;
    padding: 14px;
    border: 1px dashed var(--hairline);
    border-radius: 10px;
    margin-bottom: 14px;
  }
  .sound-bench-empty { color: var(--text-3); font-size: 12px; align-self: center; padding: 6px 4px; }
  .sound-step {
    position: relative;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    background: rgba(245,197,24,0.05);
    border: 1px solid rgba(245,197,24,0.25);
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    color: var(--text);
    transition: background .15s, border-color .15s, transform .15s;
  }
  .sound-step.active {
    background: rgba(245,197,24,0.22);
    border-color: var(--gold);
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(245,197,24,0.25);
  }
  .sound-step-num { color: var(--gold); font-weight: 500; }
  .sound-step-h { color: var(--text); }
  .sound-step-era { color: var(--text-3); font-size: 10px; }
  .sound-step-x {
    width: 16px; height: 16px;
    border-radius: 50%;
    border: none;
    background: var(--hairline-2);
    color: var(--text-3);
    cursor: pointer;
    font-size: 12px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s;
  }
  .sound-step-x:hover { background: rgba(255,80,80,0.6); color: #fff; }

  .sound-bench-foot {
    display: flex; flex-wrap: wrap; align-items: center; gap: 18px;
    padding-top: 6px;
  }
  .sound-tempo { display: inline-flex; flex-direction: column; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.16em; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

/* ============================================================
   EMISSION DATA (mirrors the Nexa Emission Schedule sheet).
   Source: https://docs.google.com/spreadsheets/d/1LmKRhChSDMldWGqycC0kkfH6WDICBLJNkUobUb-HrJg
   ============================================================ */
const TOTAL_SUPPLY = 21_000_000_000_000;
const GENESIS = new Date("2022-06-21T12:00:00Z");
const BLOCKS_PER_HALVING = 1_050_000;
const BLOCK_TARGET_SEC = 120;

// Anchor live state to known values from halving.nexa.org so the page reads as accurate.
// First halving ETA — May 1, 2026, 4:08 AM (interpreted as user's local time for display).
const FIRST_HALVING_ETA = new Date("2026-05-01T04:08:00");
// Average observed seconds per block (back-derived: 1,049,539 blocks / time-since-genesis).
const OBSERVED_BLOCK_SEC = 116;

/* ============================================================
   ROSTRUM — connect to a public Rostrum WebSocket endpoint to pull live
   mainnet data (current tip, recent block headers). Endpoints can be
   overridden via ?rostrum=wss://host:port for quick testing.
   Rostrum docs: https://nexa.gitlab.io/rostrum/
   ============================================================ */
const ROSTRUM_ENDPOINTS = (() => {
  if (typeof window !== 'undefined') {
    const p = new URLSearchParams(window.location.search).get('rostrum');
    if (p) return [p];
  }
  // Canonical public Nexa Rostrum WSS — the same host that serves the
  // official Nexa block explorer at https://electrum.nexa.org with a real
  // Let's Encrypt cert, so browser WSS upgrades work without mixed-content
  // or cert errors. Documented at nexa.gitlab.io/rostrum/websockets and
  // referenced by the @nexajs/rostrum client + community tutorials.
  return [
    'wss://electrum.nexa.org:20004',
    'wss://rostrum.nexa.org:20004',
  ];
})();

function makeRostrumClient(url) {
  let ws = null;
  let nextId = 1;
  const pending = new Map();
  const handlers = new Map();
  let openP = null;
  let closed = false;

  function open() {
    if (openP) return openP;
    openP = new Promise((resolve, reject) => {
      let timer;
      try {
        ws = new WebSocket(url);
      } catch (e) { return reject(e); }
      const fail = (e) => { closed = true; clearTimeout(timer); reject(e); };
      timer = setTimeout(() => { if (ws.readyState !== 1) fail(new Error('connect timeout')); }, 6000);
      ws.onopen = () => { clearTimeout(timer); resolve(); };
      ws.onerror = () => fail(new Error('ws error'));
      ws.onclose = () => {
        closed = true;
        for (const { reject: rj } of pending.values()) rj(new Error('closed'));
        pending.clear();
      };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        const arr = Array.isArray(m) ? m : [m];
        for (const msg of arr) {
          if (msg.id != null && pending.has(msg.id)) {
            const { resolve: r, reject: rj } = pending.get(msg.id);
            pending.delete(msg.id);
            msg.error ? rj(new Error(msg.error.message || 'rpc error')) : r(msg.result);
          } else if (msg.method) {
            const h = handlers.get(msg.method);
            if (h) h(msg.params);
          }
        }
      };
    });
    return openP;
  }

  return {
    open,
    close() { closed = true; try { ws?.close(); } catch {} },
    on(method, fn) { handlers.set(method, fn); },
    request(method, params = []) {
      return open().then(() => new Promise((resolve, reject) => {
        const id = nextId++;
        pending.set(id, { resolve, reject });
        ws.send(JSON.stringify({ jsonrpc: '2.0', id, method, params }));
        setTimeout(() => {
          if (pending.has(id)) { pending.delete(id); reject(new Error('rpc timeout')); }
        }, 12_000);
      }));
    },
  };
}

function useRostrum(blockCount = 25) {
  const [state, setState] = useState({
    connected: false, url: null,
    tipHeight: null, recentBlocks: [],
    error: null, banner: null,
  });
  // Mutable ref so changing blockCount triggers a refetch without
  // tearing down the WebSocket connection.
  const blockCountRef = useRef(blockCount);
  const fetchRecentRef = useRef(null);
  useEffect(() => {
    blockCountRef.current = blockCount;
    if (state.tipHeight && fetchRecentRef.current) {
      fetchRecentRef.current(state.tipHeight);
    }
  }, [blockCount, state.tipHeight]);

  useEffect(() => {
    let cancelled = false;
    let client = null;

    const fetchRecent = async (tipHeight) => {
      if (!client || cancelled) return;
      const N = Math.max(1, Math.min(50, blockCountRef.current || 25));
      // Per-block header fetch — Nexa headers are variable length so the
      // bulk concatenated headers method can't be sliced reliably. Parallel
      // singular requests are fast and unambiguous.
      const heightList = [];
      for (let i = N - 1; i >= 0; i--) heightList.push(tipHeight - i);
      const blocks = await Promise.all(heightList.map(async (h) => {
        try {
          const r = await client.request('blockchain.block.header', [h]);
          const headerHex = typeof r === 'string' ? r : (r?.header || r?.hex);
          return { height: h, headerHex };
        } catch {
          return { height: h, headerHex: null };
        }
      }));
      if (cancelled) return;
      // Compute hash + parse Nexa-format header. Layout per libnexa-ts 3.0.3
      // BlockHeader._fromBufferReader:
      //   prevHash (32)  bits (4 LE u32)  ancestorHash (32)  merkleRoot (32)
      //   txFilter (32)  time (4 LE u32)  height (CoreVarint)  chainWork (32)
      //   size (8 LE u64)  txCount (CoreVarint)  poolFee (CoreVarint)
      //   utxoCommitment (varlen)  minerData (varlen)  nonce (varlen)
      const readCoreVarint = (view, off) => {
        let n = 0, br = 0;
        while (true) {
          const b = view.getUint8(off + br);
          br += 1;
          n = n * 128 + (b & 0x7f);
          if (b & 0x80) n += 1; else return { value: n, bytesRead: br };
        }
      };
      const readVarLen = (view, off) => {
        const lenRes = readCoreVarint(view, off);
        return { value: lenRes.value, bytesRead: lenRes.bytesRead + lenRes.value };
      };
      // Read 32 bytes and emit a hex string (display order is reverse of memory order
      // for hash fields per Bitcoin/Nexa convention)
      const readHash = (bytes, off) => {
        const slice = bytes.slice(off, off + 32);
        const reversed = new Uint8Array(32);
        for (let i = 0; i < 32; i++) reversed[i] = slice[31 - i];
        return Array.from(reversed).map((x) => x.toString(16).padStart(2, '0')).join('');
      };
      const parseNexaHeader = (hex) => {
        if (!hex) return null;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        const view = new DataView(bytes.buffer);
        let off = 0;
        try {
          const prevHash = readHash(bytes, off); off += 32;
          const bits = view.getUint32(off, true); off += 4;
          const ancestorHash = readHash(bytes, off); off += 32;
          const merkleRoot   = readHash(bytes, off); off += 32;
          const txFilter     = readHash(bytes, off); off += 32;
          const time = view.getUint32(off, true); off += 4;
          const heightVI = readCoreVarint(view, off); off += heightVI.bytesRead;
          const chainWork    = readHash(bytes, off); off += 32;
          const sizeLow  = view.getUint32(off, true);
          const sizeHigh = view.getUint32(off + 4, true);
          const size = sizeHigh * 0x100000000 + sizeLow;
          off += 8;
          const txCountVI = readCoreVarint(view, off); off += txCountVI.bytesRead;
          const poolFeeVI = readCoreVarint(view, off); off += poolFeeVI.bytesRead;
          return {
            bits,
            timestamp: time * 1000,
            heightFromHeader: heightVI.value,
            size,
            txCount: txCountVI.value,
            poolFee: poolFeeVI.value,
            prevHash,
            merkleRoot,
            ancestorHash,
            txFilter,
            chainWork,
          };
        } catch {
          return null;
        }
      };
      if (typeof crypto !== 'undefined' && crypto.subtle) {
        await Promise.all(blocks.map(async (b) => {
          if (!b.headerHex) return;
          try {
            const bytes = new Uint8Array(b.headerHex.length / 2);
            for (let i = 0; i < bytes.length; i++) bytes[i] = parseInt(b.headerHex.substr(i * 2, 2), 16);
            // Block hash = double-SHA256 of full header bytes, byte-reversed
            let h = await crypto.subtle.digest('SHA-256', bytes);
            h = await crypto.subtle.digest('SHA-256', new Uint8Array(h));
            const out = new Uint8Array(h).reverse();
            b.hash = Array.from(out).map((x) => x.toString(16).padStart(2, '0')).join('');
            // Real Nexa header parse — gives us tx count, size, timestamp,
            // pool fee, and all the hash fields (prev/merkle/ancestor/filter/work)
            const parsed = parseNexaHeader(b.headerHex);
            if (parsed) {
              b.timestamp = parsed.timestamp;
              b.bits = parsed.bits;
              b.size = parsed.size;
              b.txCount = parsed.txCount;
              b.poolFee = parsed.poolFee;
              b.prevHashHeader = parsed.prevHash;
              b.merkleRoot = parsed.merkleRoot;
              b.ancestorHash = parsed.ancestorHash;
              b.txFilter = parsed.txFilter;
              b.chainWork = parsed.chainWork;
            }
          } catch {}
        }));
      }
      if (!cancelled) setState((s) => ({ ...s, recentBlocks: blocks }));
    };
    fetchRecentRef.current = fetchRecent;

    (async () => {
      for (const url of ROSTRUM_ENDPOINTS) {
        if (cancelled) return;
        const c = makeRostrumClient(url);
        try {
          await c.open();
          const ver = await c.request('server.version', ['nexa-emission', '1.4']);
          if (cancelled) { c.close(); return; }
          client = c;
          setState((s) => ({ ...s, connected: true, url, banner: ver }));

          c.on('blockchain.headers.subscribe', (params) => {
            const h = Array.isArray(params) ? params[0] : params;
            if (h?.height) {
              setState((s) => ({ ...s, tipHeight: h.height }));
              fetchRecent(h.height);
            }
          });
          try {
            const tip = await c.request('blockchain.headers.subscribe', []);
            if (tip?.height) {
              setState((s) => ({ ...s, tipHeight: tip.height }));
              await fetchRecent(tip.height);
            }
          } catch {}
          return;
        } catch {
          c.close();
        }
      }
      if (!cancelled) setState((s) => ({ ...s, error: 'No Rostrum endpoint reachable' }));
    })();

    return () => { cancelled = true; client?.close(); };
  }, []);

  return state;
}

// Each row from the Nexa schedule sheet.
// Years follow the official sheet's 4-year cadence (2 min/block target):
// era N happens 2022 + N×4. The countdown to the next halving still uses the
// observed block time (FIRST_HALVING_ETA) for accuracy — these years are the
// theoretical schedule.
const HALVINGS = [
  { era: 0,  label: "Genesis",      year: 2022, blockHeight: 0,          blockReward: 10_000_000   },
  { era: 1,  label: "1st Halving",  year: 2026, blockHeight: 1_050_000,  blockReward: 5_000_000    },
  { era: 2,  label: "2nd Halving",  year: 2030, blockHeight: 2_100_000,  blockReward: 2_500_000    },
  { era: 3,  label: "3rd Halving",  year: 2034, blockHeight: 3_150_000,  blockReward: 1_250_000    },
  { era: 4,  label: "4th Halving",  year: 2038, blockHeight: 4_200_000,  blockReward: 625_000      },
  { era: 5,  label: "5th Halving",  year: 2042, blockHeight: 5_250_000,  blockReward: 312_500      },
  { era: 6,  label: "6th Halving",  year: 2046, blockHeight: 6_300_000,  blockReward: 156_250      },
  { era: 7,  label: "7th Halving",  year: 2050, blockHeight: 7_350_000,  blockReward: 78_125       },
  { era: 8,  label: "8th Halving",  year: 2054, blockHeight: 8_400_000,  blockReward: 39_062.5     },
  { era: 9,  label: "9th Halving",  year: 2058, blockHeight: 9_450_000,  blockReward: 19_531.25    },
  { era: 10, label: "10th Halving", year: 2062, blockHeight: 10_500_000, blockReward: 9_765.62     },
  { era: 11, label: "11th Halving", year: 2066, blockHeight: 11_550_000, blockReward: 4_882.81     },
  { era: 12, label: "12th Halving", year: 2070, blockHeight: 12_600_000, blockReward: 2_441.40     },
  { era: 13, label: "13th Halving", year: 2074, blockHeight: 13_650_000, blockReward: 1_220.70     },
  { era: 14, label: "14th Halving", year: 2078, blockHeight: 14_700_000, blockReward: 610.35       },
  { era: 15, label: "15th Halving", year: 2082, blockHeight: 15_750_000, blockReward: 305.17       },
  { era: 16, label: "16th Halving", year: 2086, blockHeight: 16_800_000, blockReward: 152.58       },
  { era: 17, label: "17th Halving", year: 2090, blockHeight: 17_850_000, blockReward: 76.29        },
  { era: 18, label: "18th Halving", year: 2094, blockHeight: 18_900_000, blockReward: 38.14        },
  { era: 19, label: "19th Halving", year: 2098, blockHeight: 19_950_000, blockReward: 19.07        },
  { era: 20, label: "20th Halving", year: 2102, blockHeight: 21_000_000, blockReward: 9.53         },
  { era: 21, label: "21st Halving", year: 2106, blockHeight: 22_050_000, blockReward: 4.76         },
  { era: 22, label: "22nd Halving", year: 2110, blockHeight: 23_100_000, blockReward: 2.38         },
  { era: 23, label: "23rd Halving", year: 2114, blockHeight: 24_150_000, blockReward: 1.19         },
  { era: 24, label: "24th Halving", year: 2118, blockHeight: 25_200_000, blockReward: 0.59         },
  { era: 25, label: "25th Halving", year: 2122, blockHeight: 26_250_000, blockReward: 0.29         },
  { era: 26, label: "26th Halving", year: 2126, blockHeight: 27_300_000, blockReward: 0.14         },
  { era: 27, label: "27th Halving", year: 2130, blockHeight: 28_350_000, blockReward: 0.07         },
  { era: 28, label: "28th Halving", year: 2134, blockHeight: 29_400_000, blockReward: 0.03         },
  { era: 29, label: "29th Halving", year: 2138, blockHeight: 30_450_000, blockReward: 0.01         },
];

const EMISSION = HALVINGS.map((h, i) => {
  let emitted = 0;
  for (let j = 0; j < i; j++) emitted += HALVINGS[j].blockReward * BLOCKS_PER_HALVING;
  // Per-era date anchored to that year's June 21 (genesis anniversary). Matches
  // the official sheet's 4-year cadence regardless of observed block speed.
  return {
    ...h,
    date: `${h.year}-06-21`,
    totalEmitted: emitted,
    eraEmission: h.blockReward * BLOCKS_PER_HALVING,
    remaining: TOTAL_SUPPLY - emitted,
    pctEmitted: (emitted / TOTAL_SUPPLY) * 100,
  };
});

const TOTAL_BLOCKS = HALVINGS[HALVINGS.length - 1].blockHeight + BLOCKS_PER_HALVING;

/* Network constants from halving.nexa.org */
const NETWORK = {
  hashRate: 3_040_538_830_549.815,
  difficulty: 84_951.673557,
  capacity: ">100,000 TPS",
  network: "UTXO + PoW",
  launchType: "Fair Launch",
  launchDate: "June 21, 2022",
  perDayEmission: 7_200_000_000, // 720 blocks * 10,000,000 reward
};

/* ============================================================
   FORMATTERS
   ============================================================ */
const fmt = (n, dp = 2) => {
  if (n === undefined || n === null || isNaN(n)) return "—";
  if (Math.abs(n) >= 1e12) return (n / 1e12).toFixed(dp) + "T";
  if (Math.abs(n) >= 1e9)  return (n / 1e9).toFixed(dp) + "B";
  if (Math.abs(n) >= 1e6)  return (n / 1e6).toFixed(dp) + "M";
  if (Math.abs(n) >= 1e3)  return (n / 1e3).toFixed(dp) + "K";
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 });
};
const fmtFull = (n) => n?.toLocaleString(undefined, { maximumFractionDigits: 2 }) ?? "—";
// Floor-rounding so 99.9978% never rounds up to a misleading "100.00%".
// Only displays "100.00" when emission is genuinely complete.
const fmtPct = (n) => {
  if (n == null || isNaN(n)) return "—";
  if (n >= 100) return "100.00";
  return (Math.floor(n * 100) / 100).toFixed(2);
};
const fmtDate = (d) => new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" });
const fmtDateLong = (d) => new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });

/* ============================================================
   STATE COMPUTATION (anchored to first-halving ETA)
   ============================================================ */
function getCurrent(now = new Date()) {
  // Block height: anchor to known FIRST_HALVING_ETA before that, then project
  // forward at the protocol target rate (since difficulty adjusts back to it).
  let currentBlock;
  if (now < FIRST_HALVING_ETA) {
    const secsToFirstHalving = (FIRST_HALVING_ETA - now) / 1000;
    currentBlock = Math.max(0, BLOCKS_PER_HALVING - Math.round(secsToFirstHalving / OBSERVED_BLOCK_SEC));
  } else {
    const secsAfter = (now - FIRST_HALVING_ETA) / 1000;
    currentBlock = BLOCKS_PER_HALVING + Math.round(secsAfter / BLOCK_TARGET_SEC);
  }
  const currentEra = Math.min(HALVINGS.length - 1, Math.floor(currentBlock / BLOCKS_PER_HALVING));
  const eraStart = currentEra * BLOCKS_PER_HALVING;
  const blocksIntoEra = currentBlock - eraStart;
  const reward = HALVINGS[currentEra].blockReward;
  let emitted = 0;
  for (let i = 0; i < currentEra; i++) emitted += HALVINGS[i].blockReward * BLOCKS_PER_HALVING;
  emitted += blocksIntoEra * reward;
  const next = HALVINGS[currentEra + 1];
  // ETA of the NEXT halving — projected from current block at protocol target rate.
  const nextEta = next
    ? new Date(now.getTime() + (next.blockHeight - currentBlock) * BLOCK_TARGET_SEC * 1000)
    : null;
  const secsToNext = nextEta ? Math.max(0, (nextEta - now) / 1000) : null;
  return {
    currentEra, currentBlock, blocksIntoEra, reward,
    emitted, remaining: TOTAL_SUPPLY - emitted,
    pct: (emitted / TOTAL_SUPPLY) * 100,
    blocksToNext: next ? next.blockHeight - currentBlock : null,
    next, nextEta, secsToNext,
  };
}

function stateAtBlock(blockHeight) {
  const b = Math.max(0, Math.min(TOTAL_BLOCKS, blockHeight));
  const eraIdx = Math.min(HALVINGS.length - 1, Math.floor(b / BLOCKS_PER_HALVING));
  const blocksIntoEra = b - eraIdx * BLOCKS_PER_HALVING;
  const reward = HALVINGS[eraIdx].blockReward;
  let emitted = 0;
  for (let i = 0; i < eraIdx; i++) emitted += HALVINGS[i].blockReward * BLOCKS_PER_HALVING;
  emitted += blocksIntoEra * reward;
  // Use the protocol target (120s) for projected dates so the schedule
  // matches the canonical Nexa Emission Schedule spreadsheet years
  // (era N → 2022 + N×4). Real-world history uses observed cadence,
  // but anything past the current tip is a deterministic projection.
  const dateMs = GENESIS.getTime() + b * BLOCK_TARGET_SEC * 1000;
  return {
    block: b, eraIdx, blocksIntoEra, reward,
    emitted, remaining: TOTAL_SUPPLY - emitted,
    pct: (emitted / TOTAL_SUPPLY) * 100,
    date: new Date(dateMs),
  };
}

function fmtDuration(secs, compact = false) {
  if (secs == null) return "—";
  const d = Math.floor(secs / 86400);
  const h = Math.floor((secs % 86400) / 3600);
  const m = Math.floor((secs % 3600) / 60);
  const s = Math.floor(secs % 60);
  if (compact) {
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m ${s}s`;
  }
  return { d, h, m, s };
}

/* ============================================================
   HOOKS
   ============================================================ */
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { el.classList.add('in'); obs.disconnect(); } });
    }, { threshold: 0.12 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return ref;
}

function useNow(intervalMs = 1000) {
  const [now, setNow] = useState(new Date());
  useEffect(() => {
    const t = setInterval(() => setNow(new Date()), intervalMs);
    return () => clearInterval(t);
  }, [intervalMs]);
  return now;
}

/* ---- Countdown to first halving ---- */
function HeroCountdown({ targetDate }) {
  const now = useNow(1000);
  const [prev, setPrev] = useState({ d: 0, h: 0, m: 0, s: 0 });

  const remaining = useMemo(() => {
    const secs = Math.max(0, (targetDate - now) / 1000);
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    return { d, h, m, s, secs };
  }, [now, targetDate]);

  useEffect(() => { setPrev((p) => ({ ...p, ...remaining })); }, [remaining.d, remaining.h, remaining.m, remaining.s]);

  const cells = [
    { lbl: 'Days',    val: remaining.d, key: 'd' },
    { lbl: 'Hours',   val: remaining.h.toString().padStart(2, '0'), key: 'h' },
    { lbl: 'Minutes', val: remaining.m.toString().padStart(2, '0'), key: 'm' },
    { lbl: 'Seconds', val: remaining.s.toString().padStart(2, '0'), key: 's' },
  ];

  return (
    <>
      <div className="countdown" id="countdown">
        {cells.map((c) => (
          <div className="cd-cell" key={c.key}>
            <div className={`cd-num`} key={c.val}>{c.val}</div>
            <div className="cd-lbl">{c.lbl}</div>
          </div>
        ))}
      </div>
      <div className="cd-eta">
        ETA · <strong>{targetDate.toLocaleDateString("en-US", { month: 'long', day: 'numeric', year: 'numeric' })} at {targetDate.toLocaleTimeString("en-US", { hour: 'numeric', minute: '2-digit' })}</strong>
      </div>
    </>
  );
}

/* ---- Big draggable scrubber (full-width) ---- */
function Scrubber({ scrubBlock, setScrubBlock, current }) {
  const trackRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const ref = useReveal();

  const stateNow = useMemo(() => stateAtBlock(scrubBlock), [scrubBlock]);
  const handlePct = (scrubBlock / TOTAL_BLOCKS) * 100;
  const todayPct = (current.currentBlock / TOTAL_BLOCKS) * 100;

  const blockFromX = useCallback((clientX) => {
    if (!trackRef.current) return scrubBlock;
    const rect = trackRef.current.getBoundingClientRect();
    const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    return Math.round(ratio * TOTAL_BLOCKS);
  }, [scrubBlock]);

  const onPointerDown = (e) => {
    e.preventDefault();
    setDragging(true);
    setScrubBlock(blockFromX(e.clientX));
  };

  useEffect(() => {
    if (!dragging) return;
    // rAF-coalesced pointer move: pointermove can fire ~120-1000Hz on
    // high-refresh trackpads, but state should only update once per frame.
    let pendingX = null;
    let rafId = null;
    const flush = () => {
      rafId = null;
      if (pendingX != null) {
        setScrubBlock(blockFromX(pendingX));
        pendingX = null;
      }
    };
    const move = (e) => {
      pendingX = e.clientX;
      if (rafId == null) rafId = requestAnimationFrame(flush);
    };
    const up = () => {
      setDragging(false);
      if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
      // Final commit so end-of-drag value is exact
      if (pendingX != null) { setScrubBlock(blockFromX(pendingX)); pendingX = null; }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (rafId != null) cancelAnimationFrame(rafId);
    };
  }, [dragging, blockFromX, setScrubBlock]);

  const onKeyDown = (e) => {
    const step = e.shiftKey ? BLOCKS_PER_HALVING : 50_000;
    if (e.key === 'ArrowLeft') { setScrubBlock(Math.max(0, scrubBlock - step)); e.preventDefault(); }
    if (e.key === 'ArrowRight') { setScrubBlock(Math.min(TOTAL_BLOCKS, scrubBlock + step)); e.preventDefault(); }
    if (e.key === 'Home') { setScrubBlock(0); e.preventDefault(); }
    if (e.key === 'End') { setScrubBlock(TOTAL_BLOCKS); e.preventDefault(); }
  };

  const ticks = HALVINGS.map((h) => ({
    pct: (h.blockHeight / TOTAL_BLOCKS) * 100,
    passed: stateNow.block >= h.blockHeight,
    h,
  }));

  return (
    <section className="scrub-section" id="scrub">
      <div className="container-wide">
        <div className="scrubber-card reveal" ref={ref}>
          <div className="scrubber-head">
            <div>
              <div className="scrubber-title">Schedule scrubber</div>
              <div className="scrubber-h2">Pick any point in the schedule</div>
              <div className="scrubber-hint">
                <span className="full">Drag the handle. Arrow keys to step, Shift+arrows for a full halving, Home/End for the ends.</span>
                <span className="compact">Drag the handle to move through the schedule.</span>
              </div>
            </div>
            <div className="scrubber-readout">
              <div className="era">{HALVINGS[stateNow.eraIdx].label} · Era {stateNow.eraIdx}</div>
              <div className="pct">{fmtPct(stateNow.pct)}<span style={{fontSize:18}}>% emitted</span></div>
              <div className="date">{fmtDateLong(stateNow.date)}</div>
            </div>
          </div>

          <div className="scrub-scroll">
            <div className="scrub-track-wrap">
              <div className="scrub-track" ref={trackRef} onPointerDown={onPointerDown}>
                <div className="scrub-rail"></div>
                <div className="scrub-fill" style={{ width: `${handlePct}%` }}></div>
                {ticks.map((t, i) => (
                  <div
                    key={i}
                    className={`scrub-tick ${t.passed ? 'passed' : ''}`}
                    style={{ left: `${t.pct}%` }}
                    onPointerDown={(e) => { e.stopPropagation(); setScrubBlock(t.h.blockHeight); }}
                  >
                    <div className="scrub-tick-tooltip">{t.h.label} · {t.h.year}</div>
                  </div>
                ))}
                <div className="scrub-today" style={{ left: `${todayPct}%` }}>
                  <div className="scrub-today-label">NOW</div>
                </div>
                <div
                  className={`scrub-handle ${dragging ? 'dragging' : ''}`}
                  style={{ left: `${handlePct}%` }}
                  tabIndex={0}
                  onKeyDown={onKeyDown}
                  role="slider"
                  aria-valuemin="0"
                  aria-valuemax={TOTAL_BLOCKS}
                  aria-valuenow={scrubBlock}
                  aria-label="Scrub timeline"
                ></div>
              </div>

              <div className="scrub-axis">
                <span>2022</span><span>2042</span><span>2062</span><span>2082</span><span>2102</span><span>2122</span><span>2138</span>
              </div>
            </div>
          </div>

          <div className="scrubber-meta">
            <div className="scrubber-meta-cell">
              <div className="scrubber-meta-label">Block height</div>
              <div className="scrubber-meta-val">{fmtFull(stateNow.block)}</div>
            </div>
            <div className="scrubber-meta-cell">
              <div className="scrubber-meta-label">Block reward</div>
              <div className="scrubber-meta-val gold">{fmt(stateNow.reward)}</div>
            </div>
            <div className="scrubber-meta-cell">
              <div className="scrubber-meta-label">Total emitted</div>
              <div className="scrubber-meta-val">{fmt(stateNow.emitted, 2)}</div>
            </div>
            <div className="scrubber-meta-cell">
              <div className="scrubber-meta-label">Remaining</div>
              <div className="scrubber-meta-val">{fmt(stateNow.remaining, 2)}</div>
            </div>
            <div className="scrubber-meta-cell">
              <div className="scrubber-meta-label">Era progress</div>
              <div className="scrubber-meta-val">{((stateNow.blocksIntoEra / BLOCKS_PER_HALVING) * 100).toFixed(1)}%</div>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function HalvingCards({ selected, setSelected, currentEra, setScrubBlock, openModal }) {

  const fmtD = (a, b, suffix = '') => {
    if (a == null || b == null) return '—';

    return (d > 0 ? '+' : '') + fmt(d, 2) + suffix;

              key={e.era}

              <div className="card-line"><span className="k">Block</span><span className="v">{fmt(e.blockHeight, 1)}</span></div>
              <div className="card-line"><span className="k">Emitted</span><span className="v">{fmtPct(e.pctEmitted)}%</span></div>
            </button>
          ))}
        </div>

        <div className="era-compare">
          <div className="era-compare-head">
            <div>
              <div className="section-tag">Compare</div>
              <h3>Two eras side by side</h3>
            </div>
            <div className="era-compare-pickers">
              <select className="era-compare-select a" value={compareA} onChange={(e) => setCompareA(parseInt(e.target.value, 10))}>
                {EMISSION.map((e) => (<option key={e.era} value={e.era}>{e.label} · {e.year}</option>))}
              </select>
              <button className="era-swap-btn" title="Swap A and B" onClick={() => { const a = compareA; setCompareA(compareB); setCompareB(a); }}>⇄</button>
              <select className="era-compare-select b" value={compareB} onChange={(e) => setCompareB(parseInt(e.target.value, 10))}>
                {EMISSION.map((e) => (<option key={e.era} value={e.era}>{e.label} · {e.year}</option>))}
              </select>
              <button className="era-random-btn" title="Pick two random eras" onClick={() => {
                let a = Math.floor(Math.random() * HALVINGS.length);
                let b = Math.floor(Math.random() * HALVINGS.length);
                if (a === b) b = (b + 1) % HALVINGS.length;
                setCompareA(a); setCompareB(b);
              }}>Random</button>
            </div>
          </div>

          <div className="era-compare-table">
            <div className="ec-header">
              <div className="ec-h-metric">Metric</div>
              <div className="ec-h-side a">
                <span className="ec-h-dot"></span>
                <span className="ec-h-name">A · {eA.label} · {eA.year}</span>
              </div>
              <div className="ec-h-side b">
                <span className="ec-h-dot"></span>
                <span className="ec-h-name">B · {eB.label} · {eB.year}</span>
              </div>
              <div className="ec-h-delta">Δ B − A</div>
            </div>
            {(() => {
              // Inflation rate at era start: annual issuance during this era
              // ÷ supply already in circulation. Each halving cuts the rate roughly
              // in half (issuance halves while supply nearly doubles).
              const inflA = eA.totalEmitted > 0 ? (eA.blockReward * BLOCKS_PER_YEAR / eA.totalEmitted) * 100 : null;
              const inflB = eB.totalEmitted > 0 ? (eB.blockReward * BLOCKS_PER_YEAR / eB.totalEmitted) * 100 : null;
              // Stock-to-flow at era start
              const s2fA = eA.totalEmitted > 0 ? eA.totalEmitted / (eA.blockReward * BLOCKS_PER_YEAR) : null;
              const s2fB = eB.totalEmitted > 0 ? eB.totalEmitted / (eB.blockReward * BLOCKS_PER_YEAR) : null;
              // Days from genesis at era start (block height × target seconds)
              const daysA = Math.round(eA.blockHeight * BLOCK_TARGET_SEC / 86400);
              const daysB = Math.round(eB.blockHeight * BLOCK_TARGET_SEC / 86400);
              // Era duration — fixed 1,050,000 blocks × 120 s ÷ 86400 = 1,458.33 days
              const eraDays = Math.round(BLOCKS_PER_HALVING * BLOCK_TARGET_SEC / 86400);
              const fmtPctV = (v) => v == null ? '—' : (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%';
              const fmtRatio = (v) => v == null ? '—' : (v >= 1000 ? fmt(v, 0) : v >= 100 ? v.toFixed(0) : v.toFixed(2));
              const rows = [
                { lbl: 'Era',                 a: `Era ${eA.era}`,                  b: `Era ${eB.era}`,                  numA: eA.era, numB: eB.era, hideBar: true, delta: null },
                { lbl: 'Year',                a: eA.year,                          b: eB.year,                          numA: 0, numB: 0, hideBar: true, delta: (eB.year - eA.year >= 0 ? '+' : '') + (eB.year - eA.year) + ' yr' },
                { lbl: 'Days from genesis',   a: fmtFull(daysA) + ' d',            b: fmtFull(daysB) + ' d',            numA: daysA, numB: daysB, delta: ((daysB - daysA) >= 0 ? '+' : '') + fmtFull(daysB - daysA) + ' days' },
                { lbl: 'Block height',        a: fmtFull(eA.blockHeight),          b: fmtFull(eB.blockHeight),          numA: eA.blockHeight, numB: eB.blockHeight, delta: fmtD(eA.blockHeight, eB.blockHeight) + ' blocks' },
                { lbl: 'Block reward',        a: fmt(eA.blockReward, 2),           b: fmt(eB.blockReward, 2),           numA: eA.blockReward, numB: eB.blockReward, delta: eA.blockReward !== 0 ? (eB.blockReward / eA.blockReward * 100).toFixed(0) + '% of A' : '—', gold: true },
                { lbl: 'Era duration',        a: fmtFull(eraDays) + ' d',          b: fmtFull(eraDays) + ' d',          numA: eraDays, numB: eraDays, hideBar: true, delta: '0 days' },
                { lbl: 'Coins per era',       a: fmt(eA.eraEmission, 2),           b: fmt(eB.eraEmission, 2),           numA: eA.eraEmission, numB: eB.eraEmission, delta: fmtD(eA.eraEmission, eB.eraEmission) },
                { lbl: 'Cumulative emitted',  a: fmt(eA.totalEmitted, 2),          b: fmt(eB.totalEmitted, 2),          numA: eA.totalEmitted, numB: eB.totalEmitted, delta: fmtD(eA.totalEmitted, eB.totalEmitted) },
                { lbl: 'Remaining',           a: fmt(eA.remaining, 2),             b: fmt(eB.remaining, 2),             numA: eA.remaining, numB: eB.remaining, delta: fmtD(eA.remaining, eB.remaining) },
                { lbl: '% of supply emitted', a: fmtPct(eA.pctEmitted) + '%',      b: fmtPct(eB.pctEmitted) + '%',      numA: eA.pctEmitted, numB: eB.pctEmitted, customMax: 100, delta: ((eB.pctEmitted - eA.pctEmitted) >= 0 ? '+' : '') + (eB.pctEmitted - eA.pctEmitted).toFixed(2) + ' pp' },
                { lbl: 'Annual inflation',    a: fmtPctV(inflA),                   b: fmtPctV(inflB),                   numA: inflA || 0, numB: inflB || 0, delta: (inflA != null && inflB != null) ? ((inflB - inflA) >= 0 ? '+' : '') + (inflB - inflA).toFixed(2) + ' pp' : '—' },
                { lbl: 'Stock-to-flow',       a: fmtRatio(s2fA),                   b: fmtRatio(s2fB),                   numA: s2fA || 0, numB: s2fB || 0, delta: (s2fA != null && s2fB != null) ? ((s2fB - s2fA) >= 0 ? '+' : '') + fmtRatio(s2fB - s2fA) + ' ×' : '—' },
              ];
              return rows.map((row, i) => {
                const dlt = row.delta;
                const isPositive = typeof dlt === 'string' && dlt.trim().startsWith('+');
                const isNegative = typeof dlt === 'string' && dlt.trim().startsWith('-');
                const dir = !dlt || dlt === '—' || dlt === '0' ? 'neutral' : isPositive ? 'up' : isNegative ? 'down' : 'neutral';
                const max = row.customMax || Math.max(Math.abs(row.numA) || 0, Math.abs(row.numB) || 0, 1);
                const barA = Math.max(0, Math.min(100, (row.numA / max) * 100));
                const barB = Math.max(0, Math.min(100, (row.numB / max) * 100));
                return (
                  <div className="ec-row" key={i}>
                    <div className="ec-metric">{row.lbl}</div>
                    <div className="ec-cell a">
                      <div className={`ec-val ${row.gold ? 'gold' : ''}`}>{row.a}</div>
                      {!row.hideBar && (
                        <div className="ec-bar"><div className="ec-bar-fill" style={{ width: `${barA}%` }}></div></div>
                      )}
                    </div>
                    <div className="ec-cell b">
                      <div className={`ec-val ${row.gold ? 'gold' : ''}`}>{row.b}</div>
                      {!row.hideBar && (
                        <div className="ec-bar"><div className="ec-bar-fill" style={{ width: `${barB}%` }}></div></div>
                      )}
                    </div>
                    <div className={`ec-delta ${dir}`}>
                      {dir === 'up' && <span className="arrow">↑</span>}
                      {dir === 'down' && <span className="arrow">↓</span>}
                      <span>{dlt ?? '—'}</span>
                    </div>
                  </div>
                );
              });
            })()}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---- Emission curve with draggable scrubber and multiple toggleable metrics ---- */
// Blocks per year at the protocol target (120s/block) — 365.25 days × 86400 s ÷ 120 s
const BLOCKS_PER_YEAR = (365.25 * 86400) / BLOCK_TARGET_SEC;

const CURVE_METRICS = [
  { id: 'cumulative',  label: 'Cumulative emitted', color: '#FFD700', axis: 'tn',  unit: 'T',         fill: true },
  { id: 'remaining',   label: 'Remaining supply',   color: '#A78BFA', axis: 'tn',  unit: 'T',         fill: false },
  { id: 'eraEmission', label: 'Per-era emission',   color: '#FF4081', axis: 'tn',  unit: 'T',         fill: false, stepped: true },
  { id: 'pct',         label: '% of cap emitted',   color: '#00BFFF', axis: 'pct', unit: '%',         fill: false },
  { id: 'reward',      label: 'Block reward',       color: '#14F195', axis: 'rwd', unit: 'M / blk',   fill: false, stepped: true },
  { id: 'inflation',   label: 'Annual inflation',   color: '#FF6EC7', axis: 'inf', unit: '%',         fill: false, stepped: true },
  { id: 's2f',         label: 'Stock-to-flow',      color: '#7FE7FF', axis: 's2f', unit: 'ratio',     fill: false, stepped: true },
];
function hexToRgba(hex, a) {
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  return `rgba(${r},${g},${b},${a})`;
}
// Annual inflation rate at a given supply state — issuance per year as a
// percentage of circulating supply. Deterministic from the schedule.
function inflationRateAt(state) {
  const reward = HALVINGS[state.eraIdx].blockReward;
  const annualIssuance = reward * BLOCKS_PER_YEAR;
  return state.emitted > 0 ? (annualIssuance / state.emitted) * 100 : null;
}
// Stock-to-flow ratio — circulating supply divided by annual issuance. Each
// halving doubles this metric. Bitcoin's S2F is ~55, gold's ~62. Nexa's S2F
// crosses gold around era 4 (2038) and Bitcoin's projected S2F around era 5+.
function stockToFlowAt(state) {
  const reward = HALVINGS[state.eraIdx].blockReward;
  const annualIssuance = reward * BLOCKS_PER_YEAR;
  return annualIssuance > 0 ? state.emitted / annualIssuance : null;
}
function metricValueAt(state, id) {
  switch (id) {
    case 'cumulative':  return state.emitted / 1e12;
    case 'remaining':   return state.remaining / 1e12;
    case 'eraEmission': return (HALVINGS[state.eraIdx].blockReward * BLOCKS_PER_HALVING) / 1e12;
    case 'pct':         return state.pct;
    case 'reward':      return state.reward / 1e6;
    case 'inflation':   return inflationRateAt(state);
    case 's2f':         return stockToFlowAt(state);
    default: return 0;
  }
}
function formatMetricValue(state, m) {
  const v = metricValueAt(state, m.id);
  if (v == null) return '—';
  if (m.id === 'pct')       return v.toFixed(2) + '%';
  if (m.id === 'inflation') return (v >= 10 ? v.toFixed(1) : v.toFixed(2)) + '%';
  if (m.id === 's2f')       return (v >= 100 ? v.toFixed(0) : v.toFixed(1));
  if (m.id === 'reward')    return (v < 0.01 ? v.toFixed(4) : v.toFixed(2)) + 'M';
  return v.toFixed(2) + 'T';
}

const ZOOM_PRESETS = [
  { id: 'all',    label: 'All time' },
  { id: 'now',    label: 'Now ±10 yrs' },
  { id: 'early',  label: '2022 — 2042' },
  { id: 'mid',    label: '2042 — 2080' },
  { id: 'tail',   label: '2080 — 2138' },
];
function getZoomYearRange(id, currentYear) {
  switch (id) {
    case 'now':   return { startYr: currentYear - 2, endYr: currentYear + 10 };
    case 'early': return { startYr: 2022, endYr: 2042 };
    case 'mid':   return { startYr: 2042, endYr: 2080 };
    case 'tail':  return { startYr: 2080, endYr: 2140 };
    default:      return { startYr: 0,    endYr: 9999 };
  }
}

function EmissionCurve({ scrubBlock, setScrubBlock, current }) {
  const canvasRef = useRef(null);
  const chartRef = useRef(null);
  const [dragging, setDragging] = useState(false);
  const [enabled, setEnabled] = useState({ cumulative: true, remaining: false, eraEmission: false, pct: false, reward: false, inflation: false, s2f: false });
  const [zoom, setZoom] = useState('all');
  const ref = useReveal();

  const stateAt = useMemo(() => stateAtBlock(scrubBlock), [scrubBlock]);

  const { fullLabels, fullBlockAtIdx, fullAllData } = useMemo(() => {
    const fullLabels = []; const fullBlockAtIdx = [];
    const fullAllData = { cumulative: [], remaining: [], eraEmission: [], pct: [], reward: [], inflation: [], s2f: [] };
    const step = 50_000;
    for (let b = 0; b <= TOTAL_BLOCKS; b += step) {
      const s = stateAtBlock(b);
      fullLabels.push(s.date.getUTCFullYear());
      fullBlockAtIdx.push(b);
      fullAllData.cumulative.push(s.emitted / 1e12);
      fullAllData.remaining.push(s.remaining / 1e12);
      fullAllData.eraEmission.push((HALVINGS[s.eraIdx].blockReward * BLOCKS_PER_HALVING) / 1e12);
      fullAllData.pct.push(s.pct);
      fullAllData.reward.push(s.reward / 1e6);
      fullAllData.inflation.push(inflationRateAt(s));
      fullAllData.s2f.push(stockToFlowAt(s));
    }
    return { fullLabels, fullBlockAtIdx, fullAllData };
  }, []);

  // Filter to the active zoom window so the chart isn't cramped
  const { labels, blockAtIdx, allData, data } = useMemo(() => {
    const range = getZoomYearRange(zoom, new Date().getUTCFullYear());
    const indices = [];
    fullLabels.forEach((y, i) => { if (y >= range.startYr && y <= range.endYr) indices.push(i); });
    if (indices.length === 0) return { labels: fullLabels, blockAtIdx: fullBlockAtIdx, allData: fullAllData, data: fullAllData.cumulative };
    const labels = indices.map((i) => fullLabels[i]);
    const blockAtIdx = indices.map((i) => fullBlockAtIdx[i]);
    const allData = {};
    Object.keys(fullAllData).forEach((k) => { allData[k] = indices.map((i) => fullAllData[k][i]); });
    return { labels, blockAtIdx, allData, data: allData.cumulative };
  }, [zoom, fullLabels, fullBlockAtIdx, fullAllData]);

  const findIdx = (block) => {
    let lo = 0, hi = blockAtIdx.length - 1;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (blockAtIdx[mid] < block) lo = mid + 1; else hi = mid;
    }
    return lo;
  };
  const selIdx = useMemo(() => findIdx(scrubBlock), [scrubBlock]);
  const todayIdx = useMemo(() => findIdx(current.currentBlock), [current.currentBlock]);
  const selIdxRef = useRef(selIdx);
  const todayIdxRef = useRef(todayIdx);

  useEffect(() => {
    selIdxRef.current = selIdx;
    todayIdxRef.current = todayIdx;
  }, [selIdx, todayIdx]);

  const activeMetrics = CURVE_METRICS.filter((m) => enabled[m.id]);

  const cursorPlugin = useMemo(() => ({
    id: 'cursorPlugin',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea } = chart;
      const xScale = chart.scales.x;
      const lastIdx = Math.max(0, (chart.data.labels?.length || 1) - 1);
      const selectedIdx = Math.max(0, Math.min(lastIdx, selIdxRef.current));
      const currentIdx = Math.max(0, Math.min(lastIdx, todayIdxRef.current));

      // Today line
      const tx = xScale.getPixelForValue(currentIdx);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(tx, chartArea.top);
      ctx.lineTo(tx, chartArea.bottom);
      ctx.setLineDash([3, 4]);
      ctx.strokeStyle = 'rgba(255,255,255,0.32)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      ctx.font = '10px JetBrains Mono';
      ctx.fillText('NOW', tx + 4, chartArea.top + 12);
      ctx.restore();

      // Selected — vertical line
      const sx = xScale.getPixelForValue(selectedIdx);
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sx, chartArea.top);
      ctx.lineTo(sx, chartArea.bottom);
      ctx.strokeStyle = 'rgba(245, 197, 24, 0.6)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();

      // Dot at the cursor for each visible dataset, in its own color
      chart.data.datasets.forEach((ds) => {
        const yScale = chart.scales[ds.yAxisID];
        if (!yScale) return;
        const value = ds.data[selectedIdx];
        if (value == null) return;
        const sy = yScale.getPixelForValue(value);
        ctx.save();
        ctx.beginPath();
        ctx.arc(sx, sy, 6, 0, Math.PI * 2);
        ctx.fillStyle = ds.borderColor;
        ctx.strokeStyle = '#050b1a';
        ctx.lineWidth = 2.5;
        ctx.fill(); ctx.stroke();
        ctx.restore();
      });
    },
  }), []);

  useEffect(() => {
    if (!canvasRef.current) return;
    const ctx = canvasRef.current.getContext('2d');

    if (chartRef.current) chartRef.current.destroy();

    const datasets = activeMetrics.map((m) => {
      let bg = 'transparent';
      if (m.fill) {
        const grad = ctx.createLinearGradient(0, 0, 0, 400);
        grad.addColorStop(0, hexToRgba(m.color, 0.32));
        grad.addColorStop(1, hexToRgba(m.color, 0));
        bg = grad;
      }
      return {
        label: m.label,
        data: allData[m.id],
        borderColor: m.color,
        backgroundColor: bg,
        borderWidth: 2,
        fill: m.fill,
        tension: m.stepped ? 0 : 0.25,
        stepped: m.stepped ? 'before' : false,
        pointRadius: 0,
        pointHoverRadius: 0,
        yAxisID: m.axis,
      };
    });

    const hasTn  = activeMetrics.some((m) => m.axis === 'tn');
    const hasPct = activeMetrics.some((m) => m.axis === 'pct');
    const hasRwd = activeMetrics.some((m) => m.axis === 'rwd');
    const hasInf = activeMetrics.some((m) => m.axis === 'inf');
    const hasS2f = activeMetrics.some((m) => m.axis === 's2f');
    // First non-tn axis goes to the right side; tn (NEXA) always left
    const pctOnRight = !hasTn || hasPct;
    const rwdOnRight = !hasTn && !hasPct;

    chartRef.current = new Chart(ctx, {
      type: 'line',
      data: { labels, datasets },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        // Short, smooth ease-in animation only on first paint / metric toggle.
        // Cursor moves bypass this via update('none').
        animation: { duration: 350, easing: 'easeOutCubic' },
        animations: {
          // Don't re-animate per-point colours when scrubbing
          colors: false,
          numbers: { duration: 350, easing: 'easeOutCubic' },
        },
        transitions: {
          active: { animation: { duration: 0 } },
          resize: { animation: { duration: 0 } },
        },
        events: [],
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: {
          x: {
            grid: { color: 'rgba(255,255,255,0.04)', drawTicks: false },
            ticks: {
              color: '#9aa7bd',
              font: { family: 'JetBrains Mono', size: 11 },
              maxRotation: 0,
              autoSkip: true,
              autoSkipPadding: 28,
              maxTicksLimit: zoom === 'all' ? 9 : 12,
              callback: (v, i) => labels[i] ?? '',
            },
            border: { color: 'rgba(255,255,255,0.06)' },
          },
          tn: {
            type: 'linear', position: 'left', display: hasTn,
            grid: { color: 'rgba(255,255,255,0.04)' },
            ticks: { color: '#5d6b85', font: { family: 'JetBrains Mono', size: 11 }, callback: (v) => v + 'T' },
            border: { display: false },
            suggestedMin: 0, suggestedMax: 21,
          },
          pct: {
            type: 'linear', position: hasTn ? 'right' : 'left', display: hasPct,
            grid: { drawOnChartArea: !hasTn, color: 'rgba(0, 191, 255, 0.04)' },
            ticks: { color: '#5d6b85', font: { family: 'JetBrains Mono', size: 11 }, callback: (v) => v + '%' },
            border: { display: false },
            min: 0, max: 100,
          },
          rwd: {
            type: 'logarithmic', position: rwdOnRight ? 'right' : (hasTn || hasPct ? 'right' : 'left'), display: hasRwd,
            grid: { drawOnChartArea: !hasTn && !hasPct, color: 'rgba(20, 241, 149, 0.04)' },
            ticks: { color: '#5d6b85', font: { family: 'JetBrains Mono', size: 11 }, callback: (v) => v >= 1 ? v + 'M' : v.toFixed(2) + 'M' },
            border: { display: false },
          },
          inf: {
            // Annual inflation rate — log scale because era 0 is hundreds of %
            // and later eras are tiny fractions of a %. Log keeps both readable.
            type: 'logarithmic',
            position: 'right',
            display: hasInf,
            grid: { drawOnChartArea: !hasTn && !hasPct && !hasRwd, color: 'rgba(255, 110, 199, 0.04)' },
            ticks: { color: '#5d6b85', font: { family: 'JetBrains Mono', size: 11 }, callback: (v) => v + '%' },
            border: { display: false },
          },
          s2f: {
            // Stock-to-flow doubles every halving — log scale shows the
            // geometric progression cleanly across 30 eras.
            type: 'logarithmic',
            position: 'right',
            display: hasS2f,
            grid: { drawOnChartArea: !hasTn && !hasPct && !hasRwd && !hasInf, color: 'rgba(127, 231, 255, 0.04)' },
            ticks: { color: '#5d6b85', font: { family: 'JetBrains Mono', size: 11 }, callback: (v) => v },
            border: { display: false },
          },
        },
      },
      plugins: [cursorPlugin],
    });
    return () => chartRef.current?.destroy();
  }, [labels, allData, enabled, zoom]);

  useEffect(() => { if (chartRef.current) chartRef.current.update('none'); }, [selIdx, todayIdx]);

  const toggleMetric = (id) => setEnabled((prev) => ({ ...prev, [id]: !prev[id] }));

  const blockFromX = useCallback((clientX) => {
    const chart = chartRef.current;
    if (!chart) return scrubBlock;
    const rect = canvasRef.current.getBoundingClientRect();
    const x = clientX - rect.left;
    const xScale = chart.scales.x;
    let val = xScale.getValueForPixel(x);
    val = Math.max(0, Math.min(blockAtIdx.length - 1, Math.round(val)));
    return blockAtIdx[val];
  }, [blockAtIdx, scrubBlock]);

  const onPointerDown = (e) => { e.preventDefault(); setDragging(true); setScrubBlock(blockFromX(e.clientX)); };

  useEffect(() => {
    if (!dragging) return;
    let pendingX = null;
    let rafId = null;
    const flush = () => {
      rafId = null;
      if (pendingX != null) {
        setScrubBlock(blockFromX(pendingX));
        pendingX = null;
      }
    };
    const move = (e) => {
      pendingX = e.clientX;
      if (rafId == null) rafId = requestAnimationFrame(flush);
    };
    const up = () => {
      setDragging(false);
      if (rafId != null) { cancelAnimationFrame(rafId); rafId = null; }
      if (pendingX != null) { setScrubBlock(blockFromX(pendingX)); pendingX = null; }
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    return () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      if (rafId != null) cancelAnimationFrame(rafId);
    };
  }, [dragging, blockFromX, setScrubBlock]);

  return (
    <section id="curve">
      <div className="container">
        <div className="section-bar reveal" ref={ref}>
          <div>
            <div className="section-tag">Emission curve</div>
            <h2>Cumulative supply, 2022 to 2138</h2>
            <p>Seven overlay-able metrics on a multi-axis chart. Drag horizontally to move the cursor.</p>
          </div>
        </div>

        <div className="chart-wrap">
          <div className="chart-metrics">
            {CURVE_METRICS.map((m) => {
              const isOn = !!enabled[m.id];
              return (
                <button
                  key={m.id}
                  type="button"
                  className={`chart-metric-pill ${isOn ? 'active' : ''}`}
                  onClick={() => toggleMetric(m.id)}
                  style={isOn ? { borderColor: m.color, background: hexToRgba(m.color, 0.10), color: '#fff' } : {}}
                >
                  <span className="pill-dot" style={{ background: m.color, boxShadow: isOn ? `0 0 8px ${m.color}` : 'none' }}></span>
                  <span>{m.label}</span>
                  {isOn && <span className="pill-val" style={{ color: m.color }}>{formatMetricValue(stateAt, m)}</span>}
                </button>
              );
            })}
          </div>
          <div className="chart-zoom">
            <span className="chart-zoom-label">Zoom</span>
            {ZOOM_PRESETS.map((z) => (
              <button
                key={z.id}
                type="button"
                className={`chart-zoom-pill ${zoom === z.id ? 'active' : ''}`}
                onClick={() => setZoom(z.id)}
              >{z.label}</button>
            ))}
          </div>
          <div className="chart-readout">
            <div className="chart-readout-l">
              <span className="chart-readout-era">Selected</span>
              <span className="chart-readout-val">{fmtDate(stateAt.date)}</span>
              <span className="chart-readout-meta">Era {stateAt.eraIdx}</span>
              <span className="chart-readout-meta">· Block {fmtFull(stateAt.block)}</span>
              <span className="chart-readout-meta">· {fmtPct(stateAt.pct)}% emitted</span>
            </div>
            <span className="chart-hint">Drag to scrub</span>
          </div>
          <div className="chart-canvas-wrap" onPointerDown={onPointerDown}>
            <canvas ref={canvasRef}></canvas>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---- Fundamentals ---- */
function Fundamentals() {

            <p>
              Nexa launched on June 21, 2022 with a <strong>10,000,000-NEXA reward per block</strong>. Blocks target a <strong>two-minute interval</strong>, so the network produces about 720 blocks per day and 1,050,000 blocks every four years.
            </p>
            <p>
              The reward halves every 1,050,000 blocks. Era 0 emits 10.5T NEXA, which is half the total supply. Era 1 emits half of that, era 2 half of that, and so on. Total supply approaches <strong>21,000,000,000,000 NEXA</strong> but never reaches it exactly.
            </p>
            <p>
              Blocks have averaged around {OBSERVED_BLOCK_SEC} seconds in practice rather than the 120-second target, so halvings happen a few weeks earlier than a calendar projection would suggest. Otherwise the schedule is deterministic and verifiable on-chain.
            </p>
            <p>
              By 2138 the per-block subsidy hits 0.01 NEXA. From there miner revenue is dominated by <strong>transaction fees</strong>, and new issuance is effectively zero.
            </p>
          </div>
          <div className="notes-aside">
            <h4>Constants</h4>

              <dt>Total supply</dt><dd>21,000,000,000,000</dd>
