function findCities(query, limit = 6) {
  if (!query) return [];
  const q = query.toLowerCase().trim();
  const starts = [];
  const includes = [];
  for (const c of CITIES) {
    const n = c.name.toLowerCase();
    const co = c.country.toLowerCase();
    if (n.startsWith(q) || co.startsWith(q)) starts.push(c);
    else if (n.includes(q) || co.includes(q)) includes.push(c);
  }
  return [...starts, ...includes].slice(0, limit);
}

function CityInput({ value, onChange, onSelect, placeholder, label }) {
  const [open, setOpen] = useState(false);
  const wrapRef = useRef(null);
  const sugg = findCities(value);

  useEffect(() => {
    const onDoc = (e) => { if (wrapRef.current && !wrapRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  return (
    <div>
      <div className="globe-control-label">{label}</div>
      <div className="city-input-wrap" ref={wrapRef}>
        <input
          className={`city-input ${value ? 'has-value' : ''}`}
          placeholder={placeholder}
          value={value}
          onChange={(e) => { onChange(e.target.value); setOpen(true); }}
          onFocus={() => setOpen(true)}
          onKeyDown={(e) => {
            if (e.key === 'Enter' && sugg.length > 0) {
              onSelect(sugg[0]);
              setOpen(false);
              e.preventDefault();
            }
            if (e.key === 'Escape') setOpen(false);
          }}
        />
        {open && value && sugg.length > 0 && (
          <div className="city-suggestions">
            {sugg.map((c, i) => (
              <button key={i} className="city-suggestion" onMouseDown={(e) => { e.preventDefault(); onSelect(c); setOpen(false); }}>
                <span>{c.name}</span>
                <span className="country">{c.country}</span>
              </button>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function CodeRain() {
  const [columns] = useState(() => {
    const cols = [];
    const colCount = 22;
    for (let i = 0; i < colCount; i++) {
      let chars = '';
      const len = 30 + Math.floor(Math.random() * 30);
      for (let j = 0; j < len; j++) {
        const r = Math.random();
        if (r < 0.5) chars += '0\n';
        else if (r < 0.92) chars += '1\n';
        else chars += (Math.random() < 0.5 ? 'a' : 'f') + '\n';
      }
      cols.push({
        left: (i / colCount) * 100 + (Math.random() * 4 - 2),
        duration: 14 + Math.random() * 18,
        delay: -Math.random() * 30,
        chars,
      });
    }
    return cols;
  });
  return (
    <div className="code-rain" aria-hidden="true">
      {columns.map((c, i) => (
        <div
          key={i}
          className="code-col"
          style={{ left: c.left + '%', animationDuration: c.duration + 's', animationDelay: c.delay + 's' }}
        >{c.chars}</div>
      ))}
    </div>
  );
}

function SpeedOfNexa() {
  const svgRef = useRef(null);
  const wrapRef = useRef(null);
  const [worldData, setWorldData] = useState(null);
  const [worldErr, setWorldErr] = useState(false);
  const [city1Q, setCity1Q] = useState('');
  const [city2Q, setCity2Q] = useState('');
  const [city1, setCity1] = useState(null);
  const [city2, setCity2] = useState(null);
  const [phase, setPhase] = useState('idle'); // idle | sending | confirmed
  const [progress, setProgress] = useState(0);
  const [elapsed, setElapsed] = useState(null);
  const projectionRef = useRef(null);
  const phaseRef = useRef('idle');
  const txProgressRef = useRef(0);
  const cityARef = useRef(null);
  const cityBRef = useRef(null);
  const sizeRef = useRef({ w: 0, h: 0 });
  const lambdaRef = useRef(0);
  const baseRadiusRef = useRef(0);

  useEffect(() => { phaseRef.current = phase; }, [phase]);
  useEffect(() => { cityARef.current = city1; }, [city1]);
  useEffect(() => { cityBRef.current = city2; }, [city2]);

  // Load world topology
  useEffect(() => {
    if (!window.d3 || !window.topojson) return;
    let cancelled = false;
    window.d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then((data) => { if (!cancelled) setWorldData(data); })
      .catch(() => { if (!cancelled) setWorldErr(true); });
    return () => { cancelled = true; };
  }, []);

  // Initialise globe
  useEffect(() => {
    if (!worldData || !svgRef.current || !window.d3) return;
    const d3 = window.d3;
    const topojson = window.topojson;
    const svg = d3.select(svgRef.current);
    svg.selectAll('*').remove();

    const setSize = () => {
      const r = wrapRef.current.getBoundingClientRect();
      sizeRef.current = { w: r.width, h: r.height };
      svg.attr('viewBox', `0 0 ${r.width} ${r.height}`);
    };
    setSize();

    const { w, h } = sizeRef.current;
    const radius = Math.min(w, h) * 0.42;
    baseRadiusRef.current = radius;
    const projection = d3.geoOrthographic()
      .scale(radius)
      .translate([w / 2, h / 2])
      .rotate([0, -18, 0])
      .clipAngle(90);
    projectionRef.current = projection;
    const path = d3.geoPath(projection);

    // glow ring (outside the sphere)
    svg.append('circle')
      .attr('class', 'glow-ring')
      .attr('cx', w / 2).attr('cy', h / 2)
      .attr('r', radius + 10);

    const g = svg.append('g');
    g.append('path').datum({ type: 'Sphere' }).attr('class', 'sphere');
    g.append('path').datum(d3.geoGraticule().step([15, 15])()).attr('class', 'graticule');

    const countries = topojson.feature(worldData, worldData.objects.countries);
    g.append('g').attr('class', 'countries')
      .selectAll('path')
      .data(countries.features)
      .join('path')
      .attr('class', 'country');

    const arcG = svg.append('g').attr('class', 'arcs');
    const cityG = svg.append('g').attr('class', 'cities');

    function inFront(lng, lat) {
      const rot = projection.rotate();
      const cosc = Math.sin(-rot[1] * Math.PI / 180) * Math.sin(lat * Math.PI / 180)
                 + Math.cos(-rot[1] * Math.PI / 180) * Math.cos(lat * Math.PI / 180) * Math.cos((lng + rot[0]) * Math.PI / 180);
      return cosc >= -0.05;
    }

    function renderBase() {
      g.select('.sphere').attr('d', path);
      g.select('.graticule').attr('d', path);
      g.selectAll('.country').attr('d', path);
      svg.select('.glow-ring').attr('r', projection.scale() + 10);
    }

    function renderArcs() {
      arcG.selectAll('*').remove();
      const a = cityARef.current, b = cityBRef.current;
      if (!a || !b) return;

      const interp = d3.geoInterpolate([a.lng, a.lat], [b.lng, b.lat]);
      const fullPts = Array.from({ length: 97 }, (_, i) => interp(i / 96));
      arcG.append('path')
        .datum({ type: 'LineString', coordinates: fullPts })
        .attr('class', 'arc-line faint')
        .attr('d', path);

      const tp = txProgressRef.current;
      if (tp <= 0) return;

      // Launch burst at city A while the arrow leaves (first 25% of travel)
      if (tp < 0.25 && inFront(a.lng, a.lat)) {
        const [ax, ay] = projection([a.lng, a.lat]);
        const burstR = 6 + tp * 60;
        const burstOpacity = Math.max(0, 0.7 - tp * 2.8);
        arcG.append('circle')
          .attr('cx', ax).attr('cy', ay)
          .attr('r', burstR)
          .attr('fill', 'none')
          .attr('stroke', 'rgba(245, 197, 24, 1)')
          .attr('stroke-width', 2)
          .attr('opacity', burstOpacity);
        arcG.append('circle')
          .attr('cx', ax).attr('cy', ay)
          .attr('r', burstR * 0.6)
          .attr('fill', 'none')
          .attr('stroke', 'rgba(245, 197, 24, 0.6)')
          .attr('stroke-width', 1.5)
          .attr('opacity', burstOpacity);
      }

      // Glowing trail behind the arrow (longer for sense of speed)
      const trailLen = 0.32;
      const trailStart = Math.max(0, tp - trailLen);
      const trailPts = [];
      const steps = 128;
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        if (u >= trailStart && u <= tp) trailPts.push(interp(u));
      }
      if (trailPts.length > 1) {
        arcG.append('path')
          .datum({ type: 'LineString', coordinates: trailPts })
          .attr('class', 'tx-trail')
          .attr('d', path);
      }

      // Comet sparks — three smaller dots fading behind the arrow
      [0.06, 0.12, 0.18].forEach((offset, i) => {
        const u = tp - offset;
        if (u < 0) return;
        const sp = interp(u);
        if (!inFront(sp[0], sp[1])) return;
        const [sx, sy] = projection(sp);
        arcG.append('circle')
          .attr('class', 'tx-spark')
          .attr('cx', sx).attr('cy', sy)
          .attr('r', 3.5 - i * 0.9)
          .attr('fill', 'var(--gold)')
          .attr('opacity', 0.7 - i * 0.18);
      });

      // Arrow head — triangle pointing in the direction of travel
      const headPos = interp(tp);
      if (!inFront(headPos[0], headPos[1])) return;
      const [hx, hy] = projection(headPos);
      const eps = 0.012;
      const t0 = Math.max(0, tp - eps);
      const t1 = Math.min(1, tp + eps);
      const p0 = projection(interp(t0));
      const p1 = projection(interp(t1));
      const angle = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]) * 180 / Math.PI;
      arcG.append('path')
        .attr('class', 'tx-arrow')
        .attr('d', 'M -12 -7 L 14 0 L -12 7 L -6 0 Z')
        .attr('transform', `translate(${hx},${hy}) rotate(${angle})`);
    }

    function renderCities() {
      cityG.selectAll('*').remove();
      const a = cityARef.current, b = cityBRef.current;
      [a, b].filter(Boolean).forEach((c, i) => {
        if (!inFront(c.lng, c.lat)) return;
        const [x, y] = projection([c.lng, c.lat]);
        const grp = cityG.append('g').attr('transform', `translate(${x},${y})`);
        grp.append('circle').attr('class', 'city-pin-halo pulse').attr('r', 4);
        grp.append('circle').attr('class', 'city-pin').attr('r', 4);
        grp.append('text')
          .attr('class', 'city-label')
          .attr('x', 8).attr('y', -8)
          .text((i === 0 ? 'A · ' : 'B · ') + c.name);
      });
    }

    function renderAll() {
      renderBase();
      renderArcs();
      renderCities();
    }
    renderAll();

    // Auto rotate when idle
    let last = performance.now();
    const timer = d3.timer((elapsed) => {
      const now = performance.now();
      const dt = (now - last) / 1000;
      last = now;
      if (phaseRef.current === 'idle') {
        lambdaRef.current = (lambdaRef.current + dt * 5) % 360;
        projection.rotate([lambdaRef.current, -18, 0]);
        renderAll();
      }
    });

    // Expose imperative renderAll via ref so animateTx can call it
    svgRef.current._renderAll = renderAll;

    const onResize = () => {
      setSize();
      const radius = Math.min(sizeRef.current.w, sizeRef.current.h) * 0.42;
      baseRadiusRef.current = radius;
      projection.scale(radius).translate([sizeRef.current.w / 2, sizeRef.current.h / 2]);
      svg.select('.glow-ring')
        .attr('cx', sizeRef.current.w / 2)
        .attr('cy', sizeRef.current.h / 2)
        .attr('r', radius + 10);
      renderAll();
    };
    window.addEventListener('resize', onResize);

    return () => {
      timer.stop();
      window.removeEventListener('resize', onResize);
    };
  }, [worldData]);

  // Re-render when cities change (idle case)
  useEffect(() => {
    if (svgRef.current && svgRef.current._renderAll && phaseRef.current === 'idle') {
      svgRef.current._renderAll();
    }
  }, [city1, city2]);

  const fireTx = () => {
    if (!city1 || !city2 || !projectionRef.current || !svgRef.current?._renderAll) return;
    const projection = projectionRef.current;
    const renderAll = svgRef.current._renderAll;
    setPhase('sending');
    phaseRef.current = 'sending';
    setProgress(0);
    setElapsed(null);
    txProgressRef.current = 0;

    const baseR = baseRadiusRef.current;
    const zoomR = baseR * 1.45;     // cinematic zoom-in scale
    const travelR = baseR * 1.15;   // slightly wider during travel

    const startRot = projection.rotate().slice();
    const startScale = projection.scale();
    const targetA = [-city1.lng, -city1.lat, 0];
    const targetB = [-city2.lng, -city2.lat, 0];

    const wrap180 = (a) => { while (a > 180) a -= 360; while (a < -180) a += 360; return a; };
    const lerpLng = (from, to, t) => from + wrap180(to - from) * t;
    const lerp = (a, b, t) => a + (b - a) * t;
    const lerpRot = (from, to, t) => [lerpLng(from[0], to[0], t), lerp(from[1], to[1], t), 0];
    const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
    const easeInOutCubic = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

    const interp = window.d3.geoInterpolate([city1.lng, city1.lat], [city2.lng, city2.lat]);

    // Phase timings — tight for "very fast Nexa"
    const T_ZOOM_IN  = 580;
    const T_HOLD_A   = 220;
    const T_TRAVEL   = 820;   // the fast shot
    const T_HOLD_B   = 280;
    const T_ZOOM_OUT = 580;
    const TOTAL = T_ZOOM_IN + T_HOLD_A + T_TRAVEL + T_HOLD_B + T_ZOOM_OUT;
    const startMs = performance.now();

    let impactDrawn = false;
    const drawImpact = () => {
      if (impactDrawn) return;
      impactDrawn = true;
      const svgSel = window.d3.select(svgRef.current);
      const arcG = svgSel.select('.arcs');
      if (!arcG.node()) return;
      const headPos = interp(1);
      const rot = projection.rotate();
      const cosc = Math.sin(-rot[1] * Math.PI / 180) * Math.sin(headPos[1] * Math.PI / 180)
                 + Math.cos(-rot[1] * Math.PI / 180) * Math.cos(headPos[1] * Math.PI / 180) * Math.cos((headPos[0] + rot[0]) * Math.PI / 180);
      if (cosc < -0.05) return;
      const [px, py] = projection(headPos);
      // Three concentric rings expanding in sequence — feels like a proper landing
      ['', 'delay-1', 'delay-2'].forEach((cls) => {
        arcG.append('circle')
          .attr('class', 'tx-impact')
          .attr('cx', px).attr('cy', py)
          .attr('r', 5)
          .classed('go', true)
          .classed(cls, !!cls);
      });
      // Solid centred dot that briefly persists at city B
      arcG.append('circle')
        .attr('cx', px).attr('cy', py)
        .attr('r', 5)
        .attr('fill', 'var(--gold)')
        .attr('filter', 'drop-shadow(0 0 12px rgba(245,197,24,0.9))');
    };

    function frame(now) {
      const t = now - startMs;
      let rot, scale, txp = 0;

      if (t < T_ZOOM_IN) {
        const u = easeInOutCubic(t / T_ZOOM_IN);
        rot = lerpRot(startRot, targetA, u);
        scale = lerp(startScale, zoomR, u);
      } else if (t < T_ZOOM_IN + T_HOLD_A) {
        rot = targetA; scale = zoomR;
      } else if (t < T_ZOOM_IN + T_HOLD_A + T_TRAVEL) {
        const u = (t - T_ZOOM_IN - T_HOLD_A) / T_TRAVEL;
        // Camera follows along the great circle, slight ease
        const cameraU = easeInOutCubic(u);
        const cam = interp(cameraU);
        rot = [-cam[0], -cam[1], 0];
        // Pull back during travel, snap forward at the end
        scale = lerp(zoomR, travelR, Math.sin(Math.min(u * 1.2, 1) * Math.PI));
        // Arrow shoots fast — eases out, lands first
        const arrowU = easeOutCubic(u);
        txp = arrowU;
      } else if (t < T_ZOOM_IN + T_HOLD_A + T_TRAVEL + T_HOLD_B) {
        rot = targetB; scale = zoomR; txp = 1;
        drawImpact();
      } else if (t < TOTAL) {
        const u = easeInOutCubic((t - T_ZOOM_IN - T_HOLD_A - T_TRAVEL - T_HOLD_B) / T_ZOOM_OUT);
        rot = targetB;
        scale = lerp(zoomR, baseR, u);
        txp = 1;
      } else {
        rot = targetB; scale = baseR; txp = 1;
      }

      projection.rotate(rot).scale(scale);
      txProgressRef.current = txp;
      setProgress(Math.round(Math.min(1, txp) * 100));
      renderAll();

      if (t < TOTAL) {
        requestAnimationFrame(frame);
      } else {
        phaseRef.current = 'confirmed';
        setPhase('confirmed');
        // Show the genuine "shot" portion as the headline number
        setElapsed((T_TRAVEL / 1000).toFixed(2));
        setTimeout(() => {
          phaseRef.current = 'idle';
          txProgressRef.current = 0;
          renderAll();
        }, 3500);
      }
    }
    requestAnimationFrame(frame);
  };

  // Distance between cities (haversine)
  const distanceKm = useMemo(() => {
    if (!city1 || !city2) return null;
    const R = 6371;
    const toRad = (d) => d * Math.PI / 180;
    const dLat = toRad(city2.lat - city1.lat);
    const dLng = toRad(city2.lng - city1.lng);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(city1.lat)) * Math.cos(toRad(city2.lat)) * Math.sin(dLng / 2) ** 2;
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return Math.round(R * c);
  }, [city1, city2]);

  const handleSelect1 = (c) => { setCity1(c); setCity1Q(c.name); };
  const handleSelect2 = (c) => { setCity2(c); setCity2Q(c.name); };
  const swap = () => {
    setCity1(city2); setCity2(city1);
    setCity1Q(city2 ? city2.name : ''); setCity2Q(city1 ? city1.name : '');
  };
  const reset = () => {
    setCity1(null); setCity2(null); setCity1Q(''); setCity2Q('');
    setPhase('idle'); phaseRef.current = 'idle';
    txProgressRef.current = 0; setProgress(0); setElapsed(null);
  };

  return (
    <section id="speed" className="globe-section">
      <div className="container">
        <div className="section-bar reveal">
          <div>
            <div className="section-tag">Speed of Nexa</div>
            <h2>Global transaction propagation</h2>
            <p>Pick two cities. The animation is a stylized demo, not real network telemetry. Reference value: the Nexa network sustains <strong style={{color:'var(--text)'}}>60,000+ transactions per second</strong>.</p>
          </div>
        </div>

        <div className="globe-grid">
          <div className="globe-controls">
            <CityInput
              label="From"
              value={city1Q}
              onChange={(v) => { setCity1Q(v); if (city1 && v !== city1.name) setCity1(null); }}
              onSelect={handleSelect1}
              placeholder="e.g. Tokyo"
            />
            <CityInput
              label="To"
              value={city2Q}
              onChange={(v) => { setCity2Q(v); if (city2 && v !== city2.name) setCity2(null); }}
              onSelect={handleSelect2}
              placeholder="e.g. London"
            />
            <button
              className="send-btn"
              disabled={!city1 || !city2 || phase === 'sending'}
              onClick={fireTx}
            >
              {phase === 'sending' ? `Broadcasting · ${progress}%` : phase === 'confirmed' ? 'Send another' : 'Send Nexa transaction'}
            </button>
            {city1 && city2 && (
              <div style={{display:'flex', gap:6}}>
                <button onClick={swap} style={{flex:1, padding:'9px 12px', background:'rgba(255,255,255,0.04)', border:'1px solid var(--hairline-2)', borderRadius:8, color:'var(--text-2)', fontSize:12, fontFamily:'inherit', cursor:'pointer'}}>↕ Swap</button>
                <button onClick={reset} style={{flex:1, padding:'9px 12px', background:'rgba(255,255,255,0.04)', border:'1px solid var(--hairline-2)', borderRadius:8, color:'var(--text-2)', fontSize:12, fontFamily:'inherit', cursor:'pointer'}}>↺ Reset</button>
              </div>
            )}
            {(city1 || city2) && (
              <div className="tx-status">
                {city1 && <div className="ts-row"><span className="ts-k">A</span><strong>{city1.name}</strong></div>}
                {city2 && <div className="ts-row"><span className="ts-k">B</span><strong>{city2.name}</strong></div>}
                {distanceKm != null && <div className="ts-row"><span className="ts-k">Distance</span><span>{distanceKm.toLocaleString()} km</span></div>}
                {phase === 'confirmed' && elapsed && <div className="ts-row"><span className="ts-k">Confirmed in</span><strong>{elapsed}s</strong></div>}
              </div>
            )}
            {worldErr && (
              <div className="tx-status" style={{borderColor:'rgba(255,150,100,0.3)', background:'rgba(255,150,100,0.04)'}}>
                Map data couldn't load. The globe still works — try refreshing once you're online.
              </div>
            )}
            <div className="globe-footnote">
              Animation is a fun, stylized demo. In the real world, Nexa's mainnet sustains <strong>60,000+ transactions per second</strong>.
            </div>
          </div>

          <div className="globe-canvas-wrap" ref={wrapRef}>
            <span className={`globe-overlay-tag ${phase === 'sending' ? 'live' : ''}`}>
              {phase === 'sending' ? 'BROADCASTING' : phase === 'confirmed' ? 'CONFIRMED' : 'GLOBE · LIVE'}
            </span>
            <span className="globe-demo-tag">
              Demo <span className="sep">·</span> <span className="v">60K+ TPS</span>
            </span>
            <CodeRain />
            <svg className="globe-svg" ref={svgRef}></svg>
            {city1 && city2 && (
              <div className="globe-coords">
                A <span className="v">{city1.lat.toFixed(2)}, {city1.lng.toFixed(2)}</span>
                <br/>
                B <span className="v">{city2.lat.toFixed(2)}, {city2.lng.toFixed(2)}</span>
              </div>
            )}
          </div>
        </div>
      </div>
    </section>
  );
}

/* ---- Live blockchain visualizer ---- */
function rewardForHeight(h) {
  const era = Math.min(HALVINGS.length - 1, Math.floor(h / BLOCKS_PER_HALVING));
  return HALVINGS[era].blockReward;
}
function randomHashHex(len = 60) {
  const chars = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < len; i++) s += chars[Math.floor(Math.random() * 16)];
  return s;
}
function generateNexaHash() {
  // 64-char hex with 4 leading zeros (illustrative PoW look)
  return '0000' + randomHashHex(60);
}
function shortHash(h) {
  if (!h) return '—';
  return h.slice(0, 6) + '…' + h.slice(-4);
}
function makeBlock(height, prevHash) {
  return {
    height,
    timestamp: Date.now(),
    hash: generateNexaHash(),
    prevHash,
    // Tx count and size are not knowable without a live Rostrum endpoint,
    // so we stay honest in simulated mode and let the UI render "—".
    txCount: null,
    sizeKb: null,
    reward: rewardForHeight(height),
  };
}
function timeAgo(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.floor(s / 60);
  if (m < 60) return `${m}m ${s % 60}s ago`;
  const h = Math.floor(m / 60);
  return `${h}h ${m % 60}m ago`;
}

function BlockChain({ current, rostrum, blockCount = 25, setBlockCount }) {
  const N = blockCount;
  // Initial seed is 12 placeholder blocks regardless of chosen count — this is
  // visual filler until live Rostrum data arrives. Once live, the count drives
  // exactly how many real blocks are fetched.
  const [blocks, setBlocks] = useState(() => {
    const out = [];
    let prev = generateNexaHash();
    const seedN = 12;
    for (let i = 0; i < seedN; i++) {
      const h = current.currentBlock - (seedN - 1 - i);
      const b = {
        height: h,
        timestamp: Date.now() - (seedN - 1 - i) * OBSERVED_BLOCK_SEC * 1000,
        hash: generateNexaHash(),
        prevHash: prev,
        txCount: null,
        sizeKb: null,
        reward: rewardForHeight(h),
      };
      prev = b.hash;
      out.push(b);
    }
    return out;
  });

  const [progress, setProgress] = useState(0);
  const [selected, setSelected] = useState(null);
  const [, forceTick] = useState(0); // for relative time updates
  const startRef = useRef(Date.now());
  const chainRef = useRef(null);
  const drag = useRef({ active: false, startX: 0, startScroll: 0, moved: 0 });

  // Mining tick
  useEffect(() => {
    const id = setInterval(() => {
      const elapsed = (Date.now() - startRef.current) / 1000;
      const pct = Math.min(100, (elapsed / OBSERVED_BLOCK_SEC) * 100);
      setProgress(pct);
      if (pct >= 100) {
        setBlocks((bs) => {
          const last = bs[bs.length - 1];
          const next = makeBlock(last.height + 1, last.hash);
          return [...bs.slice(-(N - 1)), next];
        });
        startRef.current = Date.now();
        setProgress(0);
      }
    }, 250);
    return () => clearInterval(id);
  }, []);

  // Update relative time labels every 5s for the detail panel
  useEffect(() => {
    const id = setInterval(() => forceTick((n) => n + 1), 5000);
    return () => clearInterval(id);
  }, []);

  // When Rostrum delivers real blocks, replace the simulated chain with mainnet data.
  // Heights, hashes, and timestamps are 100% real (header parse). Tx count, size,
  // nonce, and merkleroot come from Rostrum's blockchain.block.get extension when
  // supported by the endpoint — null otherwise, and the UI renders dashes.
  useEffect(() => {
    if (!rostrum?.connected || !rostrum.recentBlocks?.length) return;
    const tip = rostrum.tipHeight || (rostrum.recentBlocks[rostrum.recentBlocks.length - 1]?.height ?? 0);
    const real = rostrum.recentBlocks.slice(-N).map((b, i, arr) => {
      const prev = i > 0 ? arr[i - 1] : null;
      const sizeKb = b.size != null ? Math.round(b.size / 1024) : null;
      // Nexa "bits" is a uint32 difficulty target — convert to a friendlier
      // "difficulty" number (max_target / current_target, simplified).
      // bits encodes the compact representation: 0xeebbbbbb where ee=exponent.
      let difficulty = null;
      if (b.bits != null) {
        const exp = b.bits >>> 24;
        const mant = b.bits & 0x007fffff;
        // Difficulty 1 target = 0x1d00ffff. Higher difficulty = lower target.
        // Approximation: difficulty ≈ max_target / target, where target = mant * 2^(8*(exp-3))
        if (mant > 0 && exp >= 3) {
          const target = mant * Math.pow(2, 8 * (exp - 3));
          const max = 0x00ffff * Math.pow(2, 8 * (0x1d - 3));
          difficulty = max / target;
        }
      }
      // Time since previous block (interval)
      let intervalSec = null;
      if (prev?.timestamp && b.timestamp) {
        intervalSec = Math.max(0, Math.round((b.timestamp - prev.timestamp) / 1000));
      }
      return {
        height: b.height,
        timestamp: b.timestamp || (Date.now() - (arr.length - 1 - i) * OBSERVED_BLOCK_SEC * 1000),
        hash: b.hash || (b.headerHex ? b.headerHex.slice(0, 64) : generateNexaHash()),
        prevHash: b.prevHashHeader || prev?.hash || (b.headerHex ? b.headerHex.slice(8, 72) : generateNexaHash()),
        txCount: b.txCount ?? null,
        sizeKb: sizeKb,
        sizeBytes: b.size ?? null,
        nonce: b.nonce ?? null,
        merkleroot: b.merkleRoot ?? b.merkleroot ?? null,
        ancestorHash: b.ancestorHash ?? null,
        txFilter: b.txFilter ?? null,
        chainWork: b.chainWork ?? null,
        bits: b.bits ?? null,
        difficulty,
        poolFee: b.poolFee ?? null,
        confirmations: tip ? Math.max(1, tip - b.height + 1) : null,
        intervalSec,
        reward: rewardForHeight(b.height),
        live: true,
      };
    });
    if (real.length) {
      setBlocks(real);
      // Reset mining timer because we just got a fresh tip
      startRef.current = Date.now();
      setProgress(0);
    }
  }, [rostrum?.connected, rostrum?.tipHeight, rostrum?.recentBlocks]);

  // Drag to pan
  const onPointerDown = (e) => {
    if (!chainRef.current) return;
    drag.current = { active: true, startX: e.clientX, startScroll: chainRef.current.scrollLeft, moved: 0 };
    chainRef.current.classList.add('dragging');
  };
  useEffect(() => {
    const onMove = (e) => {
      if (!drag.current.active || !chainRef.current) return;
      const dx = e.clientX - drag.current.startX;
      drag.current.moved = Math.abs(dx);
      chainRef.current.scrollLeft = drag.current.startScroll - dx;
    };
    const onUp = () => {
      drag.current.active = false;
      chainRef.current?.classList.remove('dragging');
    };
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
      window.removeEventListener('pointercancel', onUp);
    };
  }, []);

  // Auto-scroll to right when a new block lands (only if user is near the right edge)
  const lastHeightRef = useRef(blocks[blocks.length - 1].height);
  useEffect(() => {
    const newest = blocks[blocks.length - 1].height;
    if (newest === lastHeightRef.current) return;
    lastHeightRef.current = newest;
    const el = chainRef.current;
    if (!el || drag.current.active) return;
    const nearRight = el.scrollLeft + el.clientWidth >= el.scrollWidth - 240;
    if (nearRight) {
      requestAnimationFrame(() => {
        el.scrollTo({ left: el.scrollWidth, behavior: 'smooth' });
      });
    }
  }, [blocks]);

  // On mount, scroll all the way right so the mining block is visible
  useEffect(() => {
    if (chainRef.current) {
      requestAnimationFrame(() => {
        if (chainRef.current) chainRef.current.scrollLeft = chainRef.current.scrollWidth;
      });
    }
  }, []);

  const scrollChain = (dir) => {
    if (!chainRef.current) return;
    chainRef.current.scrollBy({ left: dir * 320, behavior: 'smooth' });
  };
  const scrollToLive = () => {
    if (!chainRef.current) return;
    chainRef.current.scrollTo({ left: chainRef.current.scrollWidth, behavior: 'smooth' });
  };

  const lastBlock = blocks[blocks.length - 1];
  const eta = Math.max(0, OBSERVED_BLOCK_SEC * (1 - progress / 100));
  const era = selected ? Math.min(HALVINGS.length - 1, Math.floor(selected.height / BLOCKS_PER_HALVING)) : null;
  // Fresh fake nonce on each tick so the mining block visibly "searches"
  const nonceFlick = useMemo(() => {
    const c = '0123456789abcdef';
    let s = '';
    for (let i = 0; i < 6; i++) s += c[Math.floor(Math.random() * 16)];
    return '0x' + s;
  }, [progress]);

  const onBlockClick = (b) => {
    if (drag.current.moved > 6) return; // ignore click that was actually a drag
    setSelected(selected?.height === b.height ? null : b);
  };

  return (
    <section id="livechain">
      <div className="container">
        <div className="section-bar reveal">
          <div>
            <div className="section-tag">Live blocks</div>
            <h2>Recent blocks</h2>
            <p>{rostrum?.connected
              ? <>Live blocks streaming from <strong style={{color:'var(--gold)'}}>{rostrum.url.replace(/^wss:\/\//, '')}</strong> — heights, hashes, timestamps, transaction counts, and sizes are real mainnet data. Drag to pan, click for details.</>
              : <>A new block is mined every ~{Math.round(OBSERVED_BLOCK_SEC)} seconds. Heights and hashes shown are illustrative simulation — transaction count and block size show <strong>—</strong> until a live Rostrum endpoint is reached. Override the default endpoint via <code style={{color:'var(--gold)',background:'rgba(245,197,24,0.06)',padding:'1px 5px',borderRadius:3}}>?rostrum=wss://your-endpoint:port</code> in the URL.</>
            }</p>
          </div>
          <div className="chain-status">
            <span className="eta">Mining</span>
            <span className="pct">{progress.toFixed(0)}%</span>
            <span className="eta">~{Math.ceil(eta)}s</span>
          </div>
        </div>

        {setBlockCount && (
          <div className="chain-count-row">
            <span className="chain-count-label">Show last</span>
            {[10, 25, 50].map((n) => (
              <button
                key={n}
                type="button"
                className={`chain-count-pill ${blockCount === n ? 'active' : ''}`}
                onClick={() => setBlockCount(n)}
              >{n}</button>
            ))}
            <span className="chain-count-hint">blocks · live data via blockchain.block.header</span>
          </div>
        )}

        <div className="chain-wrap">
          <button className="chain-arrow left" onClick={() => scrollChain(-1)} aria-label="Scroll back through chain">‹</button>
          <button className="chain-arrow right live" onClick={scrollToLive} aria-label="Jump to live mining">›</button>
          <div className="chain" ref={chainRef} onPointerDown={onPointerDown}>
            {blocks.map((b, i) => {
              const isLast = i === blocks.length - 1;
              return (
                <React.Fragment key={b.height}>
                  <button
                    className={`block ${selected?.height === b.height ? 'active' : ''} ${isLast ? 'fresh' : ''}`}
                    onClick={() => onBlockClick(b)}
                  >
                    <div className="block-tag">{b.live ? 'LIVE BLOCK' : 'BLOCK'}</div>
                    <div className="block-height">#{b.height.toLocaleString()}</div>
                    <div className="block-hash">{shortHash(b.hash)}</div>
                    <div className="block-meta">
                      <span className="k">tx</span>
                      <span className="v">{b.txCount != null ? b.txCount.toLocaleString() : '—'}</span>
                      <span className="k">size</span>
                      <span className="v">{b.sizeKb != null ? b.sizeKb + 'KB' : '—'}</span>
                    </div>
                  </button>
                  <div className="chain-link"></div>
                </React.Fragment>
              );
            })}
            <button className="block mining" onClick={(e) => { e.stopPropagation(); setSelected(null); }}>
              <div className="mining-sweep-wrap"><div className="mining-sweep"></div></div>
              <svg className="mining-border" preserveAspectRatio="none">
                <rect
                  x="0" y="0"
                  width="100%" height="100%"
                  rx="10" ry="10"
                  pathLength="100"
                  strokeDasharray="100"
                  strokeDashoffset={100 - progress}
                  vectorEffect="non-scaling-stroke"
                />
              </svg>
              <div className="block-tag">MINING</div>
              <div className="block-height">#{(lastBlock.height + 1).toLocaleString()}</div>
              <div className="block-hash">{nonceFlick}</div>
              <div className="block-meta">
                <span className="k">tx</span><span className="v">·····</span>
                <span className="k">size</span><span className="v">·····</span>
              </div>
            </button>
          </div>
        </div>

        {selected && (
          <div className="block-detail">
            <button className="block-detail-close" onClick={() => setSelected(null)} aria-label="Close">×</button>
            <div className="block-detail-cell">
              <div className="lbl">Block height</div>
              <div className="val big">#{selected.height.toLocaleString()}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Time</div>
              <div className="val">{timeAgo(selected.timestamp)}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Block reward</div>
              <div className="val gold big">{fmtFull(selected.reward)}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Era</div>
              <div className="val">Era {era} · {HALVINGS[era].label}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Transactions</div>
              <div className="val">{selected.txCount != null ? selected.txCount.toLocaleString() : '—'}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Size</div>
              <div className="val">{selected.sizeKb != null ? selected.sizeKb.toLocaleString() + ' KB' : '—'}{selected.sizeBytes != null && <span style={{color:'var(--text-3)',fontSize:11,marginLeft:8}}>({selected.sizeBytes.toLocaleString()} B)</span>}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Confirmations</div>
              <div className="val">{selected.confirmations != null ? selected.confirmations.toLocaleString() : '—'}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Time since previous</div>
              <div className="val">{selected.intervalSec != null ? selected.intervalSec + 's' : '—'}{selected.intervalSec != null && <span style={{color:'var(--text-3)',fontSize:11,marginLeft:8}}>({(selected.intervalSec / 60).toFixed(1)} min)</span>}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Difficulty</div>
              <div className="val">{selected.difficulty != null ? fmt(selected.difficulty) : '—'}{selected.bits != null && <span style={{color:'var(--text-3)',fontSize:11,marginLeft:8}}>(bits 0x{selected.bits.toString(16)})</span>}</div>
            </div>
            <div className="block-detail-cell">
              <div className="lbl">Pool fee</div>
              <div className="val">{selected.poolFee != null ? (selected.poolFee / 100).toFixed(2) + ' NEXA' : '—'}{selected.poolFee != null && <span style={{color:'var(--text-3)',fontSize:11,marginLeft:8}}>({selected.poolFee.toLocaleString()} sats)</span>}</div>
            </div>
            <div className="block-detail-cell span3">
              <div className="lbl">Block hash</div>
              <div className="val">{selected.hash}</div>
            </div>
            <div className="block-detail-cell span3">
              <div className="lbl">Previous hash</div>
              <div className="val">{selected.prevHash}</div>
            </div>
            {selected.merkleroot && (
              <div className="block-detail-cell span3">
                <div className="lbl">Merkle root</div>
                <div className="val">{selected.merkleroot}</div>
              </div>
            )}
            {selected.ancestorHash && (
              <div className="block-detail-cell span3">
                <div className="lbl">Ancestor hash <span style={{color:'var(--text-3)',fontSize:10,letterSpacing:0.06,textTransform:'uppercase'}}>· Nexa extension</span></div>
                <div className="val">{selected.ancestorHash}</div>
              </div>
            )}
            {selected.txFilter && (
              <div className="block-detail-cell span3">
                <div className="lbl">Tx filter <span style={{color:'var(--text-3)',fontSize:10,letterSpacing:0.06,textTransform:'uppercase'}}>· bloom-style block filter</span></div>
                <div className="val">{selected.txFilter}</div>
              </div>
            )}
            {selected.chainWork && (
              <div className="block-detail-cell span3">
                <div className="lbl">Chain work <span style={{color:'var(--text-3)',fontSize:10,letterSpacing:0.06,textTransform:'uppercase'}}>· cumulative PoW</span></div>
                <div className="val">{selected.chainWork}</div>
              </div>
            )}
            {selected.live && (
              <div className="block-detail-cell span3">
                <div className="lbl">Explorer</div>
                <div className="val"><a href={`https://explorer.nexa.org/block-height/${selected.height}`} target="_blank" rel="noopener noreferrer" style={{color:'var(--gold)'}}>View on explorer.nexa.org →</a></div>
              </div>
            )}
          </div>
        )}
      </div>
    </section>
  );
}

/* Eight palettes — all anchored on Nexa gold with a mystical secondary
   accent (magenta, violet, cyan, crimson, teal, indigo, rose, emerald)
   and a tertiary highlight for fine detail. */
const ART_PALETTES = [
  // 0 — Classic Nexa: gold + violet
  { gold: '#FFE144', goldLight: '#FFFD9D', goldDark: '#B6761C', mystic: '#7B5BFF', mysticLight: '#B49CFF', highlight: '#FFFFFF' },
  // 1 — Sunset: gold + magenta
  { gold: '#FFD24A', goldLight: '#FFEFA0', goldDark: '#A86E10', mystic: '#FF3D8B', mysticLight: '#FF8FBE', highlight: '#FFE5A0' },
  // 2 — Royal: gold + violet
  { gold: '#F5C518', goldLight: '#FFF1A8', goldDark: '#8B6914', mystic: '#9D4EDD', mysticLight: '#D5A6FF', highlight: '#FFE5A0' },
  // 3 — Electric: gold + cyan
  { gold: '#FFE144', goldLight: '#FFFD9D', goldDark: '#B6761C', mystic: '#06D5FF', mysticLight: '#92F0FF', highlight: '#FFFFFF' },
  // 4 — Inferno: gold + crimson
  { gold: '#FFC107', goldLight: '#FFD55E', goldDark: '#9C7A1B', mystic: '#FF1744', mysticLight: '#FF7396', highlight: '#FFE082' },
  // 5 — Aurora: gold + emerald

      {/* Central glow + motif */}
      <circle cx={cx} cy={cy} r={spec.centerSize + 18} fill={`url(#coreGlow-${uid})`} opacity="0.7" />
      {renderCenter()}

      {/* Tiny finishing sparkles */}
      {detail >= 1.0 && [0, 90, 180, 270].map((a, i) => {
        const [x, y] = polar(spec.haloRadius * 0.85, a + spec.rotation);
        return <circle key={`sp${i}`} cx={x} cy={y} r="1.2" fill={p.highlight} opacity="0.7" />;
      })}
    </svg>
  );
}

function BlockGallery({ history, showToast }) {
  const ref = useReveal();
  const [selectedHeight, setSelectedHeight] = useState(null);
  const heroRef = useRef(null);

  const hero = useMemo(() => {
    if (selectedHeight != null) {
      const found = history.find((b) => b.height === selectedHeight);
      if (found) return found;
    }
    return history[history.length - 1];
  }, [history, selectedHeight]);

  const exportArt = async () => {
    if (!heroRef.current) return;
    try {
      const svgEl = heroRef.current.querySelector('svg.block-art');
      if (!svgEl) return;
      const cloned = svgEl.cloneNode(true);
      cloned.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      const xml = new XMLSerializer().serializeToString(cloned);
      const svg64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.src = svg64;
      await new Promise((res, rej) => {
        img.onload = res;
        img.onerror = rej;
      });
      const c = document.createElement('canvas');
      c.width = 1200; c.height = 1200;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#04081a';
      ctx.fillRect(0, 0, 1200, 1200);
      ctx.drawImage(img, 0, 0, 1200, 1200);
      c.toBlob((blob) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `nexa-block-${hero.height}.png`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showToast?.('Saved to your downloads');
      }, 'image/png');
    } catch (e) {
      showToast?.('Save failed — try again');
    }
  };

  const shareArt = () => {
    const text = `Nexa block #${hero.height.toLocaleString()} as sacred-geometry art. Every block, a unique mandala. ${getShareUrl()}#art`;
    openTweet(text);
  };

  return (
    <section id="art">
      <div className="container">
        <div className="section-bar reveal" ref={ref}>
          <div>
            <div className="section-tag">Block Art</div>
            <h2>Block hash, drawn</h2>
            <p>Each 32-byte block hash maps to a sacred-geometry mandala. Same hash, same art. No two blocks alike. A new piece arrives roughly every {OBSERVED_BLOCK_SEC} seconds.</p>
          </div>
        </div>

        <div className="art-stage">
          <div className="art-hero reveal" ref={heroRef}>
            <div className="art-hero-frame" key={hero.height}>
              <BlockArt hash={hero.hash} size={420} />
            </div>
            <div className="art-hero-meta">
              <div className="art-tag">{hero.live ? 'Live block' : (selectedHeight != null ? 'Selected block' : 'Latest block')}</div>
              <div className="art-height">#{hero.height.toLocaleString()}</div>
              <div className="art-hash">{hero.hash.slice(0, 16)}…{hero.hash.slice(-12)}</div>
              <div className="art-time">{timeAgo(hero.timestamp)}</div>
              <div className="art-actions">
                <button className="art-btn primary" onClick={exportArt}>Save as PNG</button>
                <button className="art-btn" onClick={shareArt}>Share on X</button>
                {selectedHeight != null && <button className="art-btn ghost" onClick={() => setSelectedHeight(null)}>Back to latest</button>}
              </div>
              <div className="art-explainer">
                Center motif, ray count, palette, rotation, dot ring, halo intensity — all derived from the 32 bytes of this block's hash. Every parameter is deterministic.
              </div>
            </div>
          </div>

          <div className="art-gallery">
            <div className="art-gallery-label">Recent blocks · click any to feature</div>
            <div className="art-gallery-row">
              {[...history].reverse().map((b) => (
                <button
                  key={b.height}
                  className={`art-thumb ${hero.height === b.height ? 'active' : ''}`}
                  onClick={() => setSelectedHeight(b.height)}
                  aria-label={`Block ${b.height}`}
                  title={`Block #${b.height.toLocaleString()}`}
                >
                  <BlockArt hash={b.hash} size={88} />
                  <span className="art-thumb-h">#{b.height.toLocaleString().slice(-6)}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ============================================================
   SOUNDS OF NEXA — every block hash becomes a chord. Era picks
   the instrument, reward picks the volume, hash picks the notes
   inside a musical scale (so combinations always sound musical).
   ============================================================ */
const NEXA_SCALES = {
  // (semitones from root) — pentatonic & modal scales avoid harsh dissonance
  pentMajor:   [0, 2, 4, 7, 9],
  pentMinor:   [0, 3, 5, 7, 10],
  mixolydian:  [0, 2, 4, 5, 7, 9, 10],
  dorian:      [0, 2, 3, 5, 7, 9, 10],
  ionian:      [0, 2, 4, 5, 7, 9, 11],
  lydian:      [0, 2, 4, 6, 7, 9, 11],
  hexatonic:   [0, 2, 4, 6, 8, 10],
};
const NEXA_SCALE_NAMES = Object.keys(NEXA_SCALES);

function midiToNote(midi) {
  const names = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const oct = Math.floor(midi / 12) - 1;
  return names[((midi % 12) + 12) % 12] + oct;
}

function parseHashToChord(hash, era = 0) {
  if (!hash) return null;
  const h = hash.replace(/^0x/, '').toLowerCase();
  const padded = (h + h + h).slice(0, 64);
  const b = [];
  for (let i = 0; i < 16; i += 2) b.push(parseInt(padded.substr(i, 2), 16));
  // All chords on this page share the same key (C major) so any combination
  // of blocks blends. Scale within the key varies with the hash.
  const scaleName = NEXA_SCALE_NAMES[b[0] % NEXA_SCALE_NAMES.length];
  const scale = NEXA_SCALES[scaleName];
  // Root drops one octave roughly every 6 eras so deeper eras are bassier.
  const rootMidi = 60 - Math.floor(era / 6) * 12 + (b[1] % 5);
  const noteOffsets = [
    scale[b[2] % scale.length],
    scale[b[3] % scale.length] + 12,
    scale[b[4] % scale.length] + 7,
  ];
  if (b[5] > 110) noteOffsets.push(scale[b[5] % scale.length] + 4);
  if (b[6] > 200) noteOffsets.push(scale[b[6] % scale.length] - 12); // bass note
  const notes = noteOffsets.map((n) => midiToNote(rootMidi + n));
  // Deduplicate
  const uniq = Array.from(new Set(notes));
  return {
    notes: uniq,
    scale: scaleName,
    duration: 0.45 + (b[7] / 255) * 0.45,
    detune: -8 + (b[7] / 255) * 16,
  };
}

function eraInstrumentName(era, genre = 'classical') {
  const def = GENRE_DEFS[genre] || GENRE_DEFS.classical;
